<style>

<header>
  <div class="brand">WH SURPRISE SET<small>CALIPOKE STATION</small></div>

  <div class="spacer"></div>
  <span class="badge" id="srcPill">loading…</span>
  <button class="btn sm" id="reloadSrc" title="Re-read the inventory sheet and the warehouse count">⟳ Inventory</button>
  <span class="mini">v2026-11-18b</span>

</header>
<main id="app" class="hide">
  <div class="row" id="topTabs"><div class="seg" id="tabs">
    <button data-t="home" class="on">🎁 Streams</button><button data-t="sets">🧩 Sets</button><button data-t="rules">🧺 Picker rules</button><button data-t="history">🕘 History</button></div></div>
  <div id="body"></div>

<script>
'use strict';
/* ============================================================
   WH SURPRISE SET — streams that sell surprise sets from the warehouse.
   One stream = two rounds (Set A, Set B) loaded from the prepared Excel file.

   Data (Firebase, calipoke-packstation → packstation/whSurprise):
     sets/{key}        {name, tag, items:[{name, qty}], by, at}      bundles ("… 3 pack", "… set of 3") — set up once
     aliases/{key}     {name, by, at}                                 a file name linked by hand to a product
     settings          {pickAll:[product names]}                      products the picker takes in full, not one sample
     streams/{id}      {name, date, file, createdAt, createdBy,
                        rounds:{A|B:{label, sheet, status:'ready'|'live'|'done', startedAt, startedBy, endedAt, endedBy,
                                     lines:[{id, kind:'item'|'set', name, src, qty, tags:[], pick:'sample'|'all', comps:[{name,qty}]}]}},
                        sales:{A|B:{pushId:{l, at, by, via, u, uby, uat}}},      u = undone
                        picks:{scope:{key:true}}}
   Read-only sources: the inventory sheet (names, barcodes, images) and the
   warehouse count (packstation/stockCount) for "in stock now". Nothing is written to them.
   ============================================================ */
const INVENTORY_SHEET_ID='13vYpuca93GKyRDcQJA3R6DFoP-MrAm_idEnBNgpKpTw';
const DEFAULT_ROLES=['admin','wh_backend','streamer','ls_backend'];
const DEFAULT_PICK_ALL=['fuggler collectible figure','fuggler mini backpack','fuggler mini backpack series 2','fuggler mini taba envelope','fuggler taba heads','fuggler taba heads 2'];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v==null?'':v).trim().toLowerCase().replace(/\s+/g,' ');
const clean=v=>String(v==null?'':v).toLowerCase().replace(/[^a-z0-9]/g,'');
const fbKey=k=>encodeURIComponent(String(k)).replace(/\./g,'%2E').replace(/[!'()*~]/g,c=>'%'+c.charCodeAt(0).toString(16).toUpperCase());
const fmt=n=>(+n||0).toLocaleString('en-US');
const int=v=>{ const n=parseInt(String(v==null?'':v).replace(/[, ]/g,''),10); return isFinite(n)?n:0; };
const arr=x=>Array.isArray(x)?x:(x&&typeof x==='object'?Object.keys(x).sort((a,b)=>a-b).map(k=>x[k]):[]);
const dayOf=ts=>{ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const usDate=day=>{ const [y,m,d]=String(day).split('-'); return m+'/'+d+'/'+y; };
const hhmm=ts=>ts?new Date(ts).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'';
const dur=ms=>{ const m=Math.max(0,Math.round(ms/60000)); return m>=60?Math.floor(m/60)+' h '+(m%60)+' min':m+' min'; };
let toastT=null; function toast(m,k,ms){ let t=$('.toast'); if(!t){ t=document.createElement('div'); document.body.appendChild(t); } t.textContent=m; t.className='toast '+(k||''); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),ms||3200); }
let _m=null; function modal(h,wide){ closeModal(); const bg=document.createElement('div'); bg.className='modalbg'; bg.innerHTML='<div class="modal'+(wide?' wide':'')+'">'+h+'</div>'; bg.addEventListener('mousedown',e=>{ if(e.target===bg) closeModal(); }); document.body.appendChild(bg); _m=bg; return bg; } function closeModal(){ if(_m){ const m=_m; _m=null; try{ m.remove(); }catch(e){} } }

/* ---------------- state ---------------- */
let DB=null, R=null, ME='', IS_ADMIN=false;
let INV={items:{},names:[],bc:{},at:0}, STOCK=null, SRC_ERR=[];
let SETS={}, ALIASES={}, SETTINGS={}, STREAMS={};
let VIEW={name:'home'};            // home | review | check | live | watch | report | sets | rules | history
let DRAFT=null;                    // the file being reviewed before it becomes a stream

/* ---------------- sources (read only) ---------------- */
function csvParse(text){ const rows=[]; let row=[], cur='', q=false; for(let i=0;i<text.length;i++){ const c=text[i]; if(q){ if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; } else if(c==='"') q=true; else if(c===','){ row.push(cur); cur=''; } else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; } else if(c!=='\r') cur+=c; } if(cur!==''||row.length){ row.push(cur); rows.push(row); } return rows; }
async function loadInventory(force){
  if(!force){ try{ const c=JSON.parse(localStorage.getItem('cps.whss.inv')||'null'); if(c&&Date.now()-c.at<3*3600e3){ setInv(c.rows,c.at); return; } }catch(e){} }
  const r=await fetch('https://docs.google.com/spreadsheets/d/'+INVENTORY_SHEET_ID+'/gviz/tq?tqx=out:csv&headers=1&sheet=Inventory&_='+Date.now(),{credentials:'omit',cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const raw=csvParse(await r.text()); const h=(raw[0]||[]).map(norm); const ci=(names,fb)=>{ for(const n of names){ const i=h.indexOf(n); if(i>=0) return i; } return fb; };
  if(h.indexOf('item name')<0) throw new Error('the Inventory tab was not found');
  const cN=ci(['item name'],0), cV=ci(['variation'],1), cL=ci(['location'],2), cB=ci(['barcode','upc'],4), cI=ci(['image'],5);
  const rows=[]; for(let i=1;i<raw.length;i++){ const x=raw[i]; const n=String(x[cN]||'').trim(); if(!n) continue; rows.push([n,String(x[cV]||'').trim(),String(x[cB]||'').trim(),String(x[cI]||'').trim(),String(x[cL]||'').trim()]); }
  setInv(rows,Date.now()); try{ localStorage.setItem('cps.whss.inv',JSON.stringify({at:Date.now(),rows})); }catch(e){}
}
const bcNorm=c=>String(c||'').trim().replace(/\s+/g,'');
function setInv(rows,at){
  const items={}, bc={};
  rows.forEach(([n,v,b,img,loc])=>{ const k=norm(n); const it=items[k]||(items[k]={name:n,image:'',loc:'',bcs:[]});
    if(!it.image&&img) it.image=img; if(!it.loc&&loc) it.loc=loc;
    const code=bcNorm(b); if(code){ if(it.bcs.indexOf(code)<0) it.bcs.push(code);
      [code, code.replace(/^0+/,'')].forEach(c=>{ if(!c) return; (bc[c]=bc[c]||[]); if(bc[c].indexOf(k)<0) bc[c].push(k); }); } });
  INV={items,bc,names:Object.keys(items).sort(),at};
}
/* STOCK[k] = counted in the warehouse now; RES[k] = units of orders that are not packed yet
   (still Pending in Pick & Pack, or packed but not taken off the count) — the same rule as
   Inventory → Compare. Available = counted − reserved. */
let RES={}, RES_INFO={orders:0,shifts:0};
const RES_HOURS=72;                                   // shifts opened in the last 3 days are looked at
async function loadStock(){
  const root=CPAuth.ROOT;
  const [b,c,pq,si]=await Promise.all([DB.ref(root+'/stockCount/base/items').once('value'), DB.ref(root+'/stockCount/counts').once('value'),
    DB.ref(root+'/stockCount/pending').once('value'), DB.ref(root+'/shiftIndex').once('value')]);
  const base=b.val()||{}, counts=c.val()||{}, out={}, locs={};
  Object.keys(base).forEach(k=>{ out[k]=0; });
  Object.keys(counts).forEach(L=>{ if(L==='STORE') return; const sh=counts[L]||{};
    Object.keys(sh).forEach(k=>{ const v=sh[k]; if(!v||typeof v!=='object') return; const q=(base[k]&&base[k].q>0)?base[k].q:1;
      const u=(+v.s||0)*q+(+v.b||0)+(+v.c||0)+(+v.d||0); out[k]=(out[k]||0)+u;
      /* where the product really is: every warehouse shelf of the count that holds it (same source as the Guidebook, Inventory and Warehouse Plan) */
      if(u>0){ const nk=clean(v.n||(base[k]&&base[k].n)||k)||k; (locs[nk]=locs[nk]||[]).push({L,u}); if(nk!==k) (locs[k]=locs[k]||[]).push({L,u}); } }); });
  const lpri=L=>/^[SR]-/i.test(L)?0:(/^PL-/i.test(L)?2:1);                  // pick shelves first, pallets last
  Object.keys(locs).forEach(k=>locs[k].sort((a,b)=>lpri(a.L)-lpri(b.L)||a.L.localeCompare(b.L,undefined,{numeric:true})));
  LOCS=locs;
  const res={}, info={orders:0,shifts:0};
  const keyFor=(name,variation)=>{ const va=(variation&&norm(variation)!=='default')?variation:''; const tries=[clean(name)]; if(va){ tries.push(clean(name+va)); tries.push(clean(name+' '+va)); }
    for(const t of tries){ if(t && (t in out)) return t; } return clean(name); };
  const idx=si.val()||{}, since=Date.now()-RES_HOURS*3600e3;
  const ids=Object.keys(idx).filter(id=>(idx[id].createdAt||0)>=since);
  const snaps=await Promise.all(ids.map(id=>DB.ref(root+'/shifts/'+id+'/orders').once('value').catch(()=>null)));
  snaps.forEach(sn=>{ if(!sn) return; info.shifts++; const O=sn.val()||{};
    Object.keys(O).forEach(ok=>{ const o=O[ok]; if(!o||o.deducted) return; const st=o.status||'pending'; if(st!=='pending'&&st!=='packed'&&st!=='partial') return; let any=false;
      arr(o.items).forEach(it=>{ if(!it) return; if(st!=='pending'&&(it.packed===false||(it.status&&it.status!=='ok'))) return;
        const q=Math.max(0,+it.qty||1); if(!q) return; const k=keyFor(it.name,it.variation); res[k]=(res[k]||0)+q; any=true; });
      if(any) info.orders++; }); });
  const P=pq.val()||{}; Object.keys(P).forEach(pk=>{ const x=P[pk]; if(!x||x.type!=='pack') return; let any=false;         // packed while the count was frozen
    arr(x.lines).forEach(l=>{ const q=+l.qty||0; if(l&&l.k&&q){ res[l.k]=(res[l.k]||0)+q; any=true; } }); if(any) info.orders++; });
  STOCK=out; RES=res; RES_INFO=info;
}
/* shelves of a product from the warehouse count: [{L, u}], pick shelves first; [] when it is on no shelf */
let LOCS={};
function locsOf(name){ return LOCS[clean(name)]||[]; }
/* units available in the warehouse: counted now minus what unpacked orders will still take; null = not in the count */
function countedOf(name){ if(!STOCK) return null; const k=clean(name); return (k in STOCK)?STOCK[k]:null; }
function reservedOf(name){ return RES[clean(name)]||0; }
function stockOf(name){ const c=countedOf(name); return c==null?null:c-reservedOf(name); }
/* table cell: the available number, with what it is made of on hover and under it */
function stockCell(name, need){ const c=countedOf(name); if(c==null) return '<td class="num" title="Not in the warehouse count">—</td>'; const r=reservedOf(name), a=c-r;
  return '<td class="num'+(need!=null&&a<need?' low':'')+'" title="Counted in the warehouse: '+c+(r?' · in orders not packed yet: '+r:'')+'">'+fmt(a)+(r?'<div class="mini" style="font-family:var(--body)">'+fmt(c)+' − '+fmt(r)+' in orders</div>':'')+'</td>'; }
function setStock(comps){ let m=null; for(const c of arr(comps)){ const s=stockOf(c.name); if(s==null) return null; const n=Math.floor(Math.max(0,s)/Math.max(1,+c.qty||1)); m=(m==null)?n:Math.min(m,n); } return m; }

/* ---------------- reading the Excel file ---------------- */
function cleanName(src){ return String(src||'').trim().replace(/^s-\s*/i,'').replace(/_[a-z]{2}\s*$/i,'').replace(/\s+/g,' ').trim(); }
function parseWorkbook(wb){
  const out=[];
  wb.SheetNames.forEach(sn=>{
    const raw=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
    let hi=-1, cI=-1, cQ=-1;
    for(let i=0;i<Math.min(raw.length,30)&&hi<0;i++){ const h=raw[i].map(norm); const a=h.indexOf('item'), b=h.findIndex(x=>x==='quantity'||x==='qty'); if(a>=0&&b>=0){ hi=i; cI=a; cQ=b; } }
    if(hi<0) return;                                           // a sheet without Item / Quantity columns (the notes)
    const rows=[];
    for(let i=hi+1;i<raw.length;i++){ const src=String(raw[i][cI]||'').trim(); if(!src) continue; if(/^total$/i.test(src)) break;
      const qty=int(raw[i][cQ]); if(qty<=0) continue; rows.push({src, clean:cleanName(src), qty}); }
    if(rows.length) out.push({sheet:sn, rows});
  });
  return out;
}
function guessDate(fileName){
  const m=String(fileName||'').match(/(\d{1,2})[-_.](\d{1,2})(?:[-_.](\d{2,4}))?/); const now=new Date();
  if(m){ const mo=+m[1], d=+m[2]; let y=m[3]?+m[3]:now.getFullYear(); if(y<100) y+=2000; if(mo>=1&&mo<=12&&d>=1&&d<=31) return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
  return dayOf(Date.now());
}
async function readFile(file){
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}); const sheets=parseWorkbook(wb);
    if(!sheets.length){ toast('No sheet with “Item” and “Quantity” columns in this file','err',5000); return; }
    if(sheets.length>2) toast('The file has '+sheets.length+' item sheets — the first two are used','warn',5000);
    DRAFT={file:file.name, date:guessDate(file.name), cur:0, sets:sheets.slice(0,2).map((s,i)=>({label:'Set '+'AB'[i], sheet:s.sheet, rows:s.rows.map(r=>Object.assign({alloc:{},extra:[],asSet:/(\d+\s*(pack|pc|pcs)|\bset( of \d+)?)$/i.test(r.clean)},r))}))};
    VIEW={name:'review'}; render();
  }catch(e){ toast('Could not read the file: '+(e.message||e),'err',5000); }
}

/* ---------------- what each row of the file is ---------------- */
const setKey=name=>fbKey(norm(name));
const randomBase=c=>norm(String(c).replace(/\(\s*random\s*\)/i,' '));
function rowInfo(r){
  const c=r.clean, isRandom=/\(\s*random\s*\)/i.test(c)||r.asRandom;
  if(r.link && invOf(r.link)) return {kind:'item', name:invOf(r.link).name};
  if(isRandom) return {kind:'random', base:randomBase(c)};
  if(invOf(c)) return {kind:'item', name:invOf(c).name};
  const al=ALIASES[setKey(c)]; if(al && invOf(al.name)) return {kind:'item', name:invOf(al.name).name, alias:true};
  const st=SETS[setKey(c)]; if(st) return {kind:'set', set:st};
  if(r.asSet) return {kind:'set', set:null};
  return {kind:'unknown'};
}
function randomCands(r){
  const base=randomBase(r.clean); const names=INV.names.filter(k=>k.indexOf(base+' ')===0).map(k=>INV.items[k].name);
  arr(r.extra).forEach(n=>{ if(invOf(n) && names.indexOf(invOf(n).name)<0) names.push(invOf(n).name); });
  Object.keys(r.alloc||{}).forEach(n=>{ if(invOf(n) && names.indexOf(invOf(n).name)<0) names.push(invOf(n).name); });
  return names;
}
const allocSum=r=>Object.keys(r.alloc||{}).reduce((a,k)=>a+(+r.alloc[k]||0),0);
function guessTag(name){
  const n=norm(name); const m=n.match(/((?:\S+\s+)?\d+\s*(?:pack|pc|pcs))$/)||n.match(/((?:\S+\s+){1,3}set of \d+)$/)||n.match(/((?:\S+\s+){1,2}set)$/);
  return (m?m[1]:n).replace(/^fuggler\s+/,'');
}
function pickAllList(){ if(SETTINGS&&SETTINGS.pickAllEmpty) return []; const l=arr(SETTINGS&&SETTINGS.pickAll).filter(Boolean); return l.length?l:DEFAULT_PICK_ALL; }
function savePickAll(l){ SETTINGS.pickAll=l; SETTINGS.pickAllEmpty=!l.length; return R.child('settings').update({pickAll:l.length?l:null, pickAllEmpty:l.length?null:true}).then(()=>toast('Saved','ok')); }
const isPickAll=name=>pickAllList().some(n=>norm(n)===norm(name));

/* ---------------- Code 128 (the encoder of LABEL PRINT) ---------------- */
var PATTERNS = ["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
var START_B = 104, START_C = 105, CODE_B = 100, CODE_C = 99, STOP = 106;

function digitRun(s, pos){
  var n = 0;
  while (pos + n < s.length && s[pos+n] >= "0" && s[pos+n] <= "9") n++;
  return n;
}

function encodeValues(data){
  var codes = [], i = 0, lead = digitRun(data, 0), mode;
  if (data.length >= 2 && lead === data.length && lead % 2 === 0) mode = "C";
  else if (lead >= 4) mode = "C";
  else mode = "B";
  codes.push(mode === "C" ? START_C : START_B);
  var usedC = mode === "C", usedB = mode === "B";
  while (i < data.length){
    if (mode === "C"){
      var d = digitRun(data, i);
      if (d >= 2){
        var take = d - (d % 2);
        for (var k = 0; k < take; k += 2) codes.push(parseInt(data.substr(i+k,2),10));
        i += take;
        if (i < data.length && digitRun(data,i) < 2){ codes.push(CODE_B); mode = "B"; usedB = true; }
      } else { codes.push(CODE_B); mode = "B"; usedB = true; }
    } else {
      var dd = digitRun(data, i);
      if ((dd % 2 === 0 && dd >= 4) || dd >= 6){ codes.push(CODE_C); mode = "C"; usedC = true; }
      else { codes.push(data.charCodeAt(i) - 32); i++; }
    }
  }
  var sum = codes[0];
  for (var j = 1; j < codes.length; j++) sum += codes[j] * j;
  codes.push(sum % 103);
  codes.push(STOP);
  codes.sets = (usedB && usedC) ? "B+C" : (usedC ? "C" : "B");
  return codes;
}

function encodeWidths(data){
  var codes = encodeValues(data), out = [];
  for (var i = 0; i < codes.length; i++){
    var p = PATTERNS[codes[i]];
    for (var k = 0; k < p.length; k++) out.push(+p[k]);
  }
  out.sets = codes.sets;
  return out;
}

var QUIET = 10; // quiet-zone modules on each side

function barcodeSvg(data){
  var w = encodeWidths(data), total = QUIET * 2, i;
  for (i = 0; i < w.length; i++) total += w[i];
  var rects = "", x = QUIET;
  for (i = 0; i < w.length; i++){
    if (i % 2 === 0) rects += '<rect x="' + x + '" y="0" width="' + w[i] + '" height="100"/>';
    x += w[i];
  }
  return {
    svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + total + ' 100" ' +
         'preserveAspectRatio="none" shape-rendering="crispEdges" fill="#000">' + rects + '</svg>',
    modules: total,
    sets: w.sets
  };
}

/* ---------------- set barcodes ----------------
   Every set gets its own barcode (10 digits, starts with 99 — no product uses such a code).
   It is printed on a 2.25 × 1.25 in label and scanned when the set is sold. */
function genSetCode(){ for(let n=0;n<200;n++){ const c='99'+String(Math.floor(Math.random()*1e8)).padStart(8,'0'); if(!INV.bc[c] && !Object.keys(SETS).some(k=>SETS[k].bc===c)) return c; } return '99'+String(Date.now()).slice(-8); }
function ensureSetCodes(){ Object.keys(SETS).forEach(k=>{ const st=SETS[k]; if(st && !st.bc){ st.bc=genSetCode(); R.child('sets/'+k+'/bc').set(st.bc); } }); }
const setLabelTop=st=>String(st.tag||st.name||'').toUpperCase();
function setLabelHTML(st){ return '<div class="top">'+esc(setLabelTop(st))+'</div><div class="bars">'+barcodeSvg(st.bc).svg+'</div><div class="hr">'+esc(st.bc)+'</div>'; }
function printSetLabels(jobs){            // [{set, copies}]
  let out='', n=0; jobs.forEach(j=>{ if(!j.set||!j.set.bc) return; const one=setLabelHTML(j.set); for(let i=0;i<Math.max(1,Math.min(200,j.copies||1));i++){ out+='<div class="plabel">'+one+'</div>'; n++; } });
  if(!n){ toast('Nothing to print','warn'); return; }
  $('#printArea').innerHTML=out; toast('Paper 2.25 × 1.25 in · margins None · scale 100 %','ok',5000); setTimeout(()=>window.print(),80);
}

  draw();

  m.querySelector('#seTag').oninput=e=>{ tag=e.target.value; prev(); };

  m.querySelector('#seX').onclick=()=>{ closeModal(); if(after) after(); };

function saveSet(name,tag,items,bc){ const old=SETS[setKey(name)]; const rec={name:cleanName(name), tag:String(tag||'').trim()||guessTag(name), bc:bc||(old&&old.bc)||genSetCode(), items:items.map(x=>({name:x.name,qty:Math.max(1,+x.qty||1)})), by:ME, at:Date.now()}; SETS[setKey(name)]=rec; return R.child('sets/'+setKey(name)).set(rec); }

/* ---------------- review of the loaded file ---------------- */
function draftProblems(){
  const p={unknown:0,noSet:0,random:0,short:0};
  DRAFT.sets.forEach(s=>s.rows.forEach(r=>{ const i=rowInfo(r);
    if(i.kind==='unknown') p.unknown++; else if(i.kind==='set'&&!i.set) p.noSet++; else if(i.kind==='random'&&allocSum(r)!==r.qty) p.random++;
    const st=i.kind==='item'?stockOf(i.name):(i.kind==='set'&&i.set?setStock(i.set.items):null); if(st!=null&&st<r.qty) p.short++; }));
  return p;
}
function renderReview(){
  if(!DRAFT){ VIEW={name:'home'}; return render(); }
  const S=DRAFT.sets[DRAFT.cur]||DRAFT.sets[0], P=draftProblems(), block=P.unknown+P.noSet+P.random;

function buildLines(S, prefix){
  const lines=[]; let n=0; const id=()=>prefix+(++n);
  S.rows.forEach(r=>{ const i=rowInfo(r);
    if(i.kind==='item') lines.push({id:id(), kind:'item', name:i.name, src:r.src, qty:r.qty, tags:[], pick:isPickAll(i.name)?'all':'sample'});
    else if(i.kind==='set') lines.push({id:id(), kind:'set', name:r.clean, src:r.src, qty:r.qty, tags:[i.set.tag], pick:'sample', bc:i.set.bc||'', comps:arr(i.set.items).map(c=>({name:c.name,qty:+c.qty||1}))});
    else if(i.kind==='random') randomCands(r).forEach(nm=>{ const q=+(r.alloc||{})[nm]||0; if(q>0) lines.push({id:id(), kind:'item', name:nm, src:r.src, qty:q, tags:['Random'], pick:'all', group:r.clean}); });
  });
  return lines;
}
async function confirmDraft(){
  const P=draftProblems(); if(P.unknown+P.noSet+P.random) return;
  if(P.short && !confirm(P.short+' row(s) need more than is available in the warehouse. Create the stream anyway?')) return;
  const rounds={}; DRAFT.sets.forEach((s,i)=>{ const k='AB'[i]; rounds[k]={label:s.label, sheet:s.sheet, status:'ready', lines:buildLines(s,k.toLowerCase())}; });
  const rec={name:usDate(DRAFT.date)+' WH Surprise Set', date:DRAFT.date, file:DRAFT.file, createdAt:Date.now(), createdBy:ME, rounds};
  const ref=R.child('streams').push(); await ref.set(rec); STREAMS[ref.key]=rec;
  try{ CPAuth.log('whss_stream',{text:'Prepared '+rec.name,ref:ref.key}); }catch(e){}
  DRAFT=null; toast('The stream is ready','ok'); VIEW={name:'check', sid:ref.key, scope:'both'}; render();
}

const roundKeys=s=>Object.keys((s&&s.rounds)||{}).sort();
const linesOf=(s,rk)=>arr(s&&s.rounds&&s.rounds[rk]&&s.rounds[rk].lines);
function salesOf(s,rk){ const o=(s&&s.sales&&s.sales[rk])||{}; return Object.keys(o).map(k=>Object.assign({key:k},o[k])).sort((a,b)=>a.at-b.at); }
function soldMap(s,rk){ const m={}; salesOf(s,rk).forEach(x=>{ if(!x.u) m[x.l]=(m[x.l]||0)+1; }); return m; }
function roundStats(s,rk){ const sold=soldMap(s,rk); let total=0, done=0; linesOf(s,rk).forEach(l=>{ total+=l.qty; done+=Math.min(l.qty,sold[l.id]||0); }); return {total, sold:done, left:total-done}; }

/* ---------------- picker checklist ---------------- */
function checkRows(s, scope){
  const m=new Map(); const rks=scope==='both'?roundKeys(s):[scope];
  rks.forEach(rk=>linesOf(s,rk).forEach(l=>{
    const add=(name,mode,tag,qty)=>{ const key=norm(name)+'|'+mode+'|'+norm(tag||''); let e=m.get(key);
      if(!e){ e={key,name,mode,tag:tag||'',need:0,by:{}}; m.set(key,e); }
      e.by[rk]=(e.by[rk]||0)+qty; };
    if(l.kind==='set') arr(l.comps).forEach(c=>add(c.name,'sample',arr(l.tags)[0]||l.name,(+c.qty||1)));
    else add(l.name,l.pick==='all'?'all':'sample',arr(l.tags).indexOf('Random')>=0?'Random':'',l.qty);
  }));
  const set1=new Map();                                         // one sample of a set = its products × their qty in one set
  rks.forEach(rk=>linesOf(s,rk).forEach(l=>{ if(l.kind==='set') arr(l.comps).forEach(c=>set1.set(norm(c.name)+'|sample|'+norm(arr(l.tags)[0]||l.name),+c.qty||1)); }));
  const out=[...m.values()].map(e=>{ e.need = e.mode==='all' ? Object.keys(e.by).reduce((a,k)=>a+e.by[k],0) : (set1.get(e.key)||1); e.locs=locsOf(e.name); const it=invOf(e.name); e.loc=e.locs.length?e.locs[0].L:''; e.sheetLoc=(it&&it.loc&&!/^tba$/i.test(String(it.loc).trim()))?it.loc:''; return e; });
  return out.sort((a,b)=>(a.loc||'~').localeCompare(b.loc||'~',undefined,{numeric:true})||a.name.localeCompare(b.name));
}
/* the shelves to go to, with the units on each; the inventory sheet's location only when the count has the product nowhere */
function locCell(r){
  if(r.locs&&r.locs.length){ const show=r.locs.slice(0,4);
    return show.map((x,i)=>'<span style="white-space:nowrap'+(i?';color:var(--muted)':';font-weight:700')+'">'+esc(x.L)+' <span class="mini" style="font-family:var(--body)">×'+fmt(x.u)+'</span></span>').join('<br>')+(r.locs.length>4?'<div class="mini" style="font-family:var(--body)">+'+(r.locs.length-4)+' more</div>':''); }
  return r.sheetLoc?'<span style="color:var(--muted)" title="Not on a counted shelf — location from the inventory sheet">'+esc(r.sheetLoc)+'</span>':'—';
}

let MUTE=false; try{ MUTE=localStorage.getItem('cps.whss.mute')==='1'; }catch(e){}
let _ac=null; function beep(kind){ if(MUTE) return; try{ _ac=_ac||new (window.AudioContext||window.webkitAudioContext)(); const t0=_ac.currentTime;
  const tone=(f,at,len,type)=>{ const o=_ac.createOscillator(), g=_ac.createGain(); o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,t0+at); g.gain.exponentialRampToValueAtTime(.25,t0+at+.01); g.gain.exponentialRampToValueAtTime(.0001,t0+at+len); o.connect(g); g.connect(_ac.destination); o.start(t0+at); o.stop(t0+at+len+.02); };
  if(kind==='back') tone(880,0,.16); else if(kind==='remove'){ tone(520,0,.16); tone(390,.2,.26); } else if(kind==='info') tone(660,0,.12); else if(kind==='choose'){ tone(700,0,.09); tone(700,.14,.09); } else { tone(170,0,.32,'square'); } }catch(e){} }
async function startRound(sid,rk){
  const s=STREAMS[sid]; if(!s) return; const r=s.rounds[rk];
  if(r.status==='ready'){ const other=roundKeys(s).find(k=>k!==rk&&s.rounds[k].status==='live');
    if(other && !confirm(s.rounds[other].label+' is still live. Start '+r.label+' anyway?')) return;

function choose(i){ const p=PENDING; if(!p) return; PENDING=null; if(i<0||!p.cands[i]){ MSG=null; drawMsg(); return; } sell(p.cands[i],p.via); }
/* a scanned barcode or typed text → the line that was sold.

function onScan(raw){
  const c=liveCtx(); if(!c) return; const text=String(raw||'').trim(); if(!text) return;
  const code=bcNorm(text);
  /* 1 — the barcode of a set */
  const sk=Object.keys(SETS).find(k=>SETS[k].bc && SETS[k].bc===code);
  const setLine=c.lines.find(l=>l.kind==='set' && ((l.bc&&l.bc===code) || (sk&&setKey(l.name)===sk)));
  if(setLine || sk){ PENDING=null;
    if(!setLine){ setMsg('err','NOT IN THIS SET',SETS[sk].name,'This set is not part of '+c.r.label+'.'); return; }
    return sell(setLine,'scan'); }
  /* 2 — the barcode of a product */
  const names=INV.bc[code]||INV.bc[code.replace(/^0+/,'')]||null;
  let cands, shown;
  if(names){ shown=INV.items[names[0]].name; PENDING=null;
    cands=c.lines.filter(l=>l.kind!=='set' && names.indexOf(norm(l.name))>=0);
    if(!cands.length){ const inSets=c.lines.filter(l=>l.kind==='set' && arr(l.comps).some(x=>names.indexOf(norm(x.name))>=0));
      if(inSets.length){ setMsg('err','PART OF A SET',shown,'Scan the barcode label of the set: '+inSets.map(l=>arr(l.tags)[0]||l.name).join(' / ')+'.'); return; } }
  } else {
    if(PENDING){ beep('choose'); drawMsg(true); return; }
    if(/^\d{6,}$/.test(code)){ setMsg('err','UNKNOWN BARCODE',text,'This barcode is not in the inventory.'); return; }
    const ws=norm(text).split(' ').filter(Boolean); shown=text;
    cands=c.lines.filter(l=>{ const hay=norm(l.name+' '+arr(l.tags).join(' ')+' '+arr(l.comps).map(x=>x.name).join(' ')); return ws.every(w=>hay.indexOf(w)>=0); });
    const exact=cands.filter(l=>norm(l.name)===norm(text)); if(exact.length) cands=exact;
  }
  if(!cands.length){ setMsg('err','NOT IN THIS SET',shown,'This product is not part of '+c.r.label+'.'); return; }
  const live=cands.filter(l=>leftOf(l,c.sold)>0);
  if(!live.length){ setMsg('err','ALREADY SOLD OUT',shown,'None of it is left in this round.'); return; }
  const items=live.filter(l=>l.kind!=='set').sort((a,b)=>(arr(a.tags).length-arr(b.tags).length)), sets=live.filter(l=>l.kind==='set');
  const opts=names ? [items[0]] : live;                         // a product barcode: its own line (the plain one before the Random one)
  if(opts.length===1) return sell(opts[0],names?'scan':'typed');
  PENDING={cands:opts.slice(0,9), via:names?'scan':'typed', names:names||[]}; beep('choose'); drawMsg(true);
}

  $$('#wtRounds [data-wrk]').forEach(b=>b.onclick=()=>{ VIEW.rk=b.dataset.wrk; updateWatch(); });
  const last=good.length?good[good.length-1].at:0, ms=r.startedAt?((r.endedAt||Date.now())-r.startedAt):0, perH=ms>5*60000?Math.round(t.sold/(ms/3600000)):null;
  const kv=(n,l,st)=>'<div class="kv"><div class="n"'+(st?' style="'+st+'"':'')+'>'+n+'</div><div class="l">'+l+'</div></div>';
  $('#wtKpi').innerHTML=kv(t.total,'prepared')+kv(t.sold,'sold','color:var(--ok)')+kv(t.left,'left',t.left?'':'color:var(--muted)')+
    kv(r.startedAt?dur(ms):'—','duration'+(r.startedAt?' · '+hhmm(r.startedAt)+' – '+(r.endedAt?hhmm(r.endedAt):'now'):''))+
    kv(last?hhmm(last):'—','last sale'+(last&&r.status==='live'?' · '+agoText(last):''),'font-size:20px;padding:4px 0')+
    kv(perH==null?'—':perH,'sold per hour')+kv(sales.length-good.length,'undone scans');
  $('#wtBar').style.width=(t.total?Math.round(100*t.sold/t.total):0)+'%';
  $('#wtUpd').textContent=r.status==='live'?'updates by itself · '+hhmm(Date.now()):(r.status==='done'?'round finished':'round not started yet');
  const rows=lines.map(l=>({l,left:leftOf(l,sold),sold:Math.min(l.qty,sold[l.id]||0)})).filter(x=>watchOut||x.left>0).sort((a,b)=>(a.left>0?0:1)-(b.left>0?0:1)||a.l.name.localeCompare(b.l.name));
  const keep=$('#wtList').scrollTop, keepH=$('#wtHist').scrollTop;
  $('#wtList').innerHTML=rows.length?rows.map(x=>'<div class="litem'+(x.left?'':' out')+'">'+imgOf(x.l.kind==='set'?(arr(x.l.comps)[0]||{}).name:x.l.name)+'<div class="nm"><b>'+esc(x.l.name)+'</b> '+tagsHTML(x.l)+
      (x.l.kind==='set'?'<div class="mini">'+arr(x.l.comps).map(q=>esc(q.name)+(q.qty>1?' × '+q.qty:'')).join(' + ')+'</div>':'')+'<div class="mini">prepared '+x.l.qty+' · sold '+x.sold+'</div></div>'+
      '<div class="left">'+x.left+'<span class="mini"> left</span></div>'+(x.left?'':'<span class="badge">sold out</span>')+'</div>').join('')
    :'<div class="empty">'+(lines.length?'Everything is sold.':'No items in this set.')+'</div>';
  $('#wtHistN').textContent=good.length+' sale(s)';
  $('#wtHist').innerHTML=sales.length?sales.slice().reverse().map(x=>{ const l=lines.find(q=>q.id===x.l)||{name:'?',tags:[]};
    return '<div class="hrow'+(x.u?' un':'')+'"><span class="mono" style="color:var(--muted)">'+hhmm(x.at)+'</span><span style="flex:1"><b>'+esc(l.name)+'</b> '+tagsHTML(l)+'</span><span class="mini">'+esc(x.by||'')+(x.via==='manual'?' · button':x.via==='typed'?' · typed':'')+(x.u?' · undone by '+esc(x.uby||''):'')+'</span></div>'; }).join('')
    :'<div class="empty" style="padding:22px">No sales yet.</div>';
  $('#wtList').scrollTop=keep; $('#wtHist').scrollTop=keepH;
}

/* ---------------- history ---------------- */
function renderHistory(){
  const ids=Object.keys(STREAMS).sort((a,b)=>(STREAMS[b].createdAt||0)-(STREAMS[a].createdAt||0));
  let h='<div class="row" style="margin-top:16px"><h1>🕘 History</h1><div class="spacer"></div><span class="mini">'+ids.length+' stream(s)</span></div>';
  h+=ids.length?'<div class="card" style="padding:0"><div class="tscroll" style="border:0"><table><thead><tr><th>Stream</th><th>Set</th><th>Status</th><th class="num">Prepared</th><th class="num">Sold</th><th class="num">Left</th><th>Time</th><th>By</th><th></th></tr></thead><tbody>'+
    ids.map(id=>{ const s=STREAMS[id]; return roundKeys(s).map((k,i)=>{ const r=s.rounds[k], t=roundStats(s,k);
      return '<tr><td>'+(i===0?'<b>'+esc(s.name)+'</b><div class="mini">'+esc(s.file||'')+'</div>':'')+'</td><td>'+esc(r.label)+'</td><td>'+stBadge(r.status)+'</td><td class="num">'+t.total+'</td><td class="num">'+t.sold+'</td><td class="num'+(t.left&&r.status==='done'?' low':'')+'">'+t.left+'</td><td class="mini">'+(r.startedAt?hhmm(r.startedAt)+(r.endedAt?' – '+hhmm(r.endedAt)+' · '+dur(r.endedAt-r.startedAt):' – …'):'—')+'</td><td class="mini">'+esc(r.startedBy||s.createdBy||'')+'</td>'+
        '<td class="num">'+(i===0?'<button class="btn sm" data-watch="'+id+'">👁 Watch</button> ':'')+'<button class="btn sm" data-hrep="'+id+'|'+k+'">Report</button>'+(i===0&&IS_ADMIN?' <button class="btn sm danger" data-del="'+id+'">✕</button>':'')+'</td></tr>'; }).join(''); }).join('')+'</tbody></table></div></div>'
    :'<div class="empty">No streams yet.</div>';
  $('#body').innerHTML=h;
  $$('[data-hrep]').forEach(b=>b.onclick=()=>{ const [sid,rk]=b.dataset.hrep.split('|'); VIEW={name:'report',sid,rk,from:'history'}; render(); });
  wireStreamCards();
}

/* ---------------- shell ---------------- */
function render(){
  if(!R) return;
  const top={home:'home',review:'home',check:'home',live:'home',watch:VIEW.from==='history'?'history':'home',report:VIEW.from==='history'?'history':'home',sets:'sets',rules:'rules',history:'history'}[VIEW.name]||'home';
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===top));
  $('#topTabs').classList.toggle('hide',VIEW.name==='live');
  if(_m && VIEW.name!=='sets' && VIEW.name!=='review' && VIEW.name!=='rules') closeModal();
  if(_m) return;                                                  // an open editor is not redrawn under the user
  ({home:renderHome,review:renderReview,check:renderCheck,live:renderLive,watch:renderWatch,report:renderReport,sets:renderSets,rules:renderRules,history:renderHistory}[VIEW.name]||renderHome)();
}
CPAuth.init({app:'station',header:'#hdrUser',onReady:start});
function start(u){
  const allowed=(CPAuth.ACCESS.station&&CPAuth.ACCESS.station.whsurprise)?CPAuth.can('whsurprise','station'):DEFAULT_ROLES.indexOf(u.role)>=0;
  $('#app').classList.remove('hide'); if(!allowed){ CPAuth.denied('#app','WH Surprise Set'); return; }
  ME=u.name||u.email||''; IS_ADMIN=u.role==='admin'; DB=CPAuth.db; R=DB.ref(CPAuth.ROOT+'/whSurprise');
  R.child('sets').on('value',s=>{ SETS=s.val()||{}; ensureSetCodes(); render(); });
  R.child('aliases').on('value',s=>{ ALIASES=s.val()||{}; if(VIEW.name==='review') render(); });
  R.child('settings').on('value',s=>{ SETTINGS=s.val()||{}; if(VIEW.name==='rules'||VIEW.name==='review') render(); });
  R.child('streams').limitToLast(80).on('value',s=>{ STREAMS=s.val()||{}; if(VIEW.name==='review'||VIEW.name==='sets'||VIEW.name==='rules') return; render(); });
  $$('#tabs [data-t]').forEach(b=>b.onclick=()=>{ if(DRAFT && VIEW.name==='review' && b.dataset.t!=='home' && b.dataset.t!=='sets'){ if(!confirm('Leave the file check? The loaded file is kept until you close the page.')) return; }
    VIEW={name:(b.dataset.t==='home'&&DRAFT)?'review':b.dataset.t}; render(); });
  $('#reloadSrc').onclick=()=>loadSources(true);
  loadSources(false);
}
</script>
