<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>CALIPOKE STATION · Supplier Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
<script src="https://r-alib.github.io/calipoke-admin/calipoke-auth.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1116; --panel:#161A21; --panel2:#1C2129; --raised:#222936;
  --border:#262D38; --line:#2C3543;
  --ink:#E6EAF0; --muted:#8A94A3; --faint:#5A6472;
  --accent:#21C063; --accent-d:#18742F;
  --ok:#21C063; --warn:#F2B14C; --err:#F0524D; --info:#4C9AF2;
  --r:14px; --r-sm:9px;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --disp:'Space Grotesk',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --rowh:32px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:14.5px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overflow:hidden}
button{font-family:inherit; cursor:pointer; color:inherit}
input,select{font-family:inherit; color:inherit}
.hide{display:none !important}
.mono{font-family:var(--mono)}

/* ---------- gate ---------- */
#gate{position:fixed; inset:0; z-index:200; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:20px}
.gatebox{width:100%; max-width:360px; background:var(--panel); border:1px solid var(--border); border-radius:var(--r); padding:26px 24px; text-align:center}
.gatebox .lock{font-size:34px; margin-bottom:8px}
.gatebox h1{font-family:var(--disp); font-size:18px; letter-spacing:.04em; margin:0 0 4px}
.gatebox p{color:var(--muted); font-size:13px; margin:0 0 18px}

/* ---------- shell ---------- */
#app{display:flex; flex-direction:column; height:100%}
header{display:flex; align-items:center; gap:12px; padding:9px 14px; background:rgba(14,17,22,.95);
  border-bottom:1px solid var(--border); flex:0 0 auto}
.brand{display:flex; align-items:center; gap:9px; font-family:var(--disp); font-weight:700; letter-spacing:-.01em; font-size:15px}
.dot{width:10px; height:10px; border-radius:3px; background:var(--accent); box-shadow:0 0 12px var(--accent)}
.brand small{display:block; font-family:var(--body); font-weight:500; font-size:10.5px; color:var(--muted);
  letter-spacing:.06em; text-transform:uppercase}
.spacer{flex:1}
.pill{display:inline-flex; align-items:center; gap:7px; padding:5px 10px; background:var(--panel); border:1px solid var(--border);
  border-radius:99px; font-size:12px; color:var(--muted); white-space:nowrap}
.pill b{color:var(--ink); font-family:var(--mono); font-weight:700}
.btn{background:var(--panel); border:1px solid var(--border); color:var(--ink); border-radius:var(--r-sm);
  padding:7px 12px; font-size:13px; font-weight:500; white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px; font-size:12.5px}
.btn.act{border-color:var(--accent); color:var(--ink)}
.btn:disabled{opacity:.5; cursor:default}

#main{flex:1 1 auto; display:flex; min-height:0}

/* ---------- supplier sidebar ---------- */
#side{flex:0 0 250px; display:flex; flex-direction:column; background:var(--panel); border-right:1px solid var(--border); min-height:0}
.sidehead{padding:10px 10px 8px; border-bottom:1px solid var(--border)}
.sidehead h4{margin:0 0 8px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:600;
  display:flex; align-items:center; gap:6px}
.sidehead h4 .fbadge{margin-left:auto}
.sidehead input{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:7px; padding:6px 9px; font-size:13px; outline:none}
.sidehead input:focus{border-color:var(--accent)}
.siderow{display:flex; gap:6px; margin-top:8px}
.siderow .btn{flex:1; text-align:center; padding:4px 6px; font-size:12px}
.siderow select{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:7px; padding:4px 6px; font-size:12px; outline:none; color-scheme:dark}
#supList{flex:1; overflow:auto; padding:6px}
.sup{display:flex; align-items:center; gap:8px; padding:6px 7px; border-radius:7px; font-size:13px; cursor:pointer; border:1px solid transparent}
.sup:hover{background:var(--raised)}
.sup.on{background:#12251A; border-color:#1d4530}
.sup input{accent-color:var(--accent); width:15px; height:15px; margin:0; flex:0 0 auto; pointer-events:none}
.sup .n{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sup .c{font-family:var(--mono); font-size:11px; color:var(--faint)}
.sup .o{font-family:var(--mono); font-size:11px; color:var(--warn); background:#3a2f16; border-radius:5px; padding:0 5px}
.sup .only{display:none; font-size:10.5px; color:var(--info); background:none; border:0; padding:0 2px; text-transform:uppercase; letter-spacing:.05em}
.sup:hover .only{display:inline}
.sup:hover .c{display:none}
.sidenote{padding:8px 10px; border-top:1px solid var(--border); font-size:11.5px; color:var(--faint)}

#content{flex:1 1 auto; display:flex; flex-direction:column; min-width:0; min-height:0}

/* ---------- filter bar ---------- */
.filters{display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 14px;
  background:var(--panel); border-bottom:1px solid var(--border); flex:0 0 auto}
.search{position:relative; flex:1 1 240px; min-width:190px; max-width:400px}
.search input{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:var(--r-sm);
  padding:8px 30px 8px 32px; font-size:13.5px; outline:none}
.search input:focus{border-color:var(--accent)}
.search .ic{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--faint); font-size:13px}
.search .clr{position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:0; color:var(--faint); font-size:15px; padding:2px 6px}
.seg{display:inline-flex; background:var(--panel2); border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden}
.seg button{background:transparent; border:0; border-right:1px solid var(--line); padding:7px 11px; font-size:12.5px; color:var(--muted); font-weight:600; white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--accent-d); color:#eafff1}
.dropwrap{position:relative}
.drop{position:absolute; top:calc(100% + 6px); left:0; z-index:60; background:var(--panel2); border:1px solid var(--line);
  border-radius:var(--r-sm); box-shadow:0 14px 34px rgba(0,0,0,.5); padding:10px; width:290px; max-height:60vh; overflow:auto}
.drop.right{left:auto; right:0}
.drop h4{margin:0 0 8px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:600}
.drop .dsearch{width:100%; background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:6px 9px; font-size:13px; margin-bottom:8px; outline:none}
.chk{display:flex; align-items:center; gap:8px; padding:5px 6px; border-radius:6px; font-size:13px; cursor:pointer}
.chk:hover{background:var(--raised)}
.chk input{accent-color:var(--accent); width:15px; height:15px; margin:0}
.chk .n{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.chk .c{font-family:var(--mono); font-size:11px; color:var(--faint)}
.chk.zero{opacity:.45}
.droprow{display:flex; gap:6px; margin-bottom:8px}
.droprow .btn{flex:1; text-align:center}
.dt{background:var(--panel2); border:1px solid var(--line); border-radius:var(--r-sm); padding:7px 9px; font-size:13px; outline:none; color-scheme:dark}
.fbadge{background:var(--accent-d); color:#dffbe9; border-radius:99px; padding:1px 7px; font-size:11px; font-family:var(--mono)}
.fbadge.off{background:var(--raised); color:var(--muted)}

/* ---------- KPI strip ---------- */
#kpis{display:flex; gap:8px; padding:8px 14px; background:var(--bg); border-bottom:1px solid var(--border); flex:0 0 auto; overflow-x:auto}
.kpi{flex:1 1 0; min-width:118px; background:var(--panel); border:1px solid var(--border); border-radius:var(--r-sm); padding:6px 11px}
.kpi .l{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-weight:600; white-space:nowrap}
.kpi .v{font-family:var(--mono); font-weight:700; font-size:16px; white-space:nowrap}
.kpi.good .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)}

/* ---------- table ---------- */
#tscroll{flex:1 1 auto; overflow:auto; position:relative; background:var(--bg)}
.tinner{position:relative; min-width:100%}
.thead{position:sticky; top:0; z-index:10; display:flex; background:var(--panel2); border-bottom:1px solid var(--line)}
.th{flex:0 0 auto; padding:8px 9px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
  font-weight:600; border-right:1px solid var(--border); cursor:pointer; user-select:none; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.th:hover{color:var(--ink); background:var(--raised)}
.th .ar{color:var(--accent); font-size:10px}
.th.num{text-align:right}
#spacer{position:relative}
#rowsHost{position:absolute; left:0; top:0; right:0}
.trow{display:flex; position:absolute; left:0; right:0; height:var(--rowh); align-items:stretch;
  border-bottom:1px solid #1B212A; cursor:pointer}
.trow:hover{background:#151B24}
.trow.sel{background:#12251A}
.trow.alt{background:rgba(255,255,255,.012)}
.td{flex:0 0 auto; padding:0 9px; display:flex; align-items:center; overflow:hidden; white-space:nowrap;
  text-overflow:ellipsis; font-size:13px; border-right:1px solid #1A202A}
.td.num,.td.money{justify-content:flex-end; font-family:var(--mono); font-size:12.5px}
.td.date{font-family:var(--mono); font-size:12.5px; color:var(--muted)}
.td.code{font-family:var(--mono); font-size:12.5px; color:var(--info)}
.td.dim{color:var(--muted)}
.td.pos{color:var(--warn)}
.td.good{color:var(--ok)}
.td.zero{color:var(--faint)}
.td .cb{accent-color:var(--accent); width:15px; height:15px; margin:0}
.td .nocat{color:var(--faint); margin-left:6px; font-size:11px}
.badge{font-size:10.5px; padding:1px 7px; border-radius:5px; background:var(--raised); color:var(--muted); font-weight:600; letter-spacing:.03em}
.badge.ok{background:#15311f; color:#7fdca0}
.badge.warn{background:#3a2f16; color:#f0c777}
.badge.part{background:#1d2b3d; color:#7fb2f5}

/* ---------- footer ---------- */
footer{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 14px; background:var(--panel);
  border-top:1px solid var(--border); flex:0 0 auto; font-size:12.5px; color:var(--muted)}
footer b{color:var(--ink); font-family:var(--mono)}

/* ---------- drawer ---------- */
#drawer{position:fixed; top:0; right:0; bottom:0; width:min(480px,94vw); background:var(--panel); border-left:1px solid var(--line);
  z-index:120; transform:translateX(100%); transition:transform .18s ease; display:flex; flex-direction:column}
#drawer.on{transform:none}
.dhead{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--border)}
.dhead h3{margin:0; font-family:var(--disp); font-size:15px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dbody{flex:1; overflow:auto; padding:12px 14px}
.kv{display:grid; grid-template-columns:42% 1fr; gap:6px 10px; font-size:13px; margin-bottom:14px}
.kv .k{color:var(--faint); overflow:hidden; text-overflow:ellipsis}
.kv .v{color:var(--ink); word-break:break-word}
.dsec{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin:16px 0 8px; font-weight:600}
.mrow{background:var(--panel2); border:1px solid var(--border); border-radius:var(--r-sm); padding:8px 10px; margin-bottom:7px; font-size:12.5px}
.mrow .t{display:flex; justify-content:space-between; gap:8px}
.mrow .s{color:var(--muted); font-size:12px; margin-top:3px}

/* ---------- misc ---------- */
#toasts{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:300; display:flex; flex-direction:column; gap:8px; align-items:center}
.toast{display:flex; align-items:center; gap:9px; background:var(--raised); border:1px solid var(--line); border-radius:99px;
  padding:9px 16px; font-size:13px; box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.ok{border-color:var(--accent)} .toast.err{border-color:var(--err)} .toast.warn{border-color:var(--warn)}
#loadscr{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  background:var(--bg); z-index:20; text-align:center; padding:20px}
.spin{width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#loadscr .msg{color:var(--muted); font-size:13.5px; max-width:460px}
.empty{padding:40px 20px; text-align:center; color:var(--faint); font-size:14px}
::-webkit-scrollbar{width:11px; height:11px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#2b3442; border-radius:6px; border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a4657}
#sideBtn{display:none}
@media(max-width:900px){
  #side{position:fixed; left:0; top:0; bottom:0; z-index:110; width:min(290px,88vw); transform:translateX(-100%); transition:transform .18s ease;
    box-shadow:14px 0 34px rgba(0,0,0,.5)}
  #side.on{transform:none}
  #sideBtn{display:inline-flex}
  .search{max-width:none} header .pill.hideSm{display:none}
}
</style>
</head>
<body>

<!-- ============ SIGN-IN (shared CALIPOKE account) ============ -->
<div id="gate">
  <div class="gatebox">
    <div class="lock">🔒</div>
    <h1>SUPPLIER TRACKER</h1>
    <p>Signing in…</p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hide">
  <header>
    <div class="brand"><span class="dot"></span>
      <div>CALIPOKE STATION<small>Supplier Tracker · read only · <span id="buildTag"></span></small></div>
    </div>
    <div class="spacer"></div>
    <span class="pill hideSm" id="syncPill">—</span>
    <button class="btn" id="refreshBtn">↻ Refresh</button>
    <button class="btn ghost" id="backBtn">← Station</button>
  </header>

  <div id="main">
    <!-- suppliers = tabs of the workbook -->
    <aside id="side">
      <div class="sidehead">
        <h4>Suppliers <span class="fbadge" id="supBadge">all</span></h4>
        <input id="supSearch" placeholder="find a supplier…" autocomplete="off">
        <div class="siderow">
          <button class="btn sm" id="supAll">All</button>
          <select id="supSort" title="Order of the list">
            <option value="sheet">Sheet order</option>
            <option value="az">A → Z</option>
            <option value="open">Most to deliver</option>
          </select>
        </div>
      </div>
      <div id="supList"></div>
      <div class="sidenote" id="sideNote"></div>
    </aside>

    <section id="content">
      <div class="filters" id="filters">
        <button class="btn" id="sideBtn">☰ Suppliers</button>
        <div class="search">
          <span class="ic">🔍</span>
          <input id="q" placeholder="Search item, barcode, PO#, supplier…" autocomplete="off">
          <button class="clr hide" id="qClr">×</button>
        </div>
        <div class="seg" id="statusSeg">
          <button data-s="all" class="on">All</button>
          <button data-s="delivered">Delivered</button>
          <button data-s="pending">To be delivered</button>
        </div>
        <div class="dropwrap"><button class="btn" id="typeBtn">Type <span class="fbadge off" id="typeBadge">all</span></button><div class="drop hide" id="typeDrop"></div></div>
        <div class="dropwrap"><button class="btn" id="brandBtn">Brand <span class="fbadge off" id="brandBadge">all</span></button><div class="drop hide" id="brandDrop"></div></div>
        <div class="dropwrap"><button class="btn" id="seriesBtn">Series <span class="fbadge off" id="seriesBadge">all</span></button><div class="drop hide" id="seriesDrop"></div></div>
        <input type="date" class="dt" id="dFrom" title="Order date from">
        <input type="date" class="dt" id="dTo" title="Order date to">
        <div class="dropwrap">
          <button class="btn sm" id="presetBtn">Period ▾</button>
          <div class="drop hide" id="presetDrop" style="width:200px"></div>
        </div>
        <div class="seg" id="modeSeg" title="Every order line, or one row per item with totals">
          <button data-m="lines" class="on">Order lines</button>
          <button data-m="items">By item</button>
        </div>
        <div class="dropwrap">
          <button class="btn" id="colsBtn">Columns <span class="fbadge off" id="colsBadge">—</span></button>
          <div class="drop right hide" id="colsDrop"></div>
        </div>
        <button class="btn sm ghost" id="clearBtn">Reset</button>
      </div>

      <div id="kpis"></div>

      <div id="tscroll">
        <div class="tinner" id="tinner">
          <div class="thead" id="thead"></div>
          <div id="spacer"><div id="rowsHost"></div></div>
        </div>
        <div class="empty hide" id="emptyMsg">Nothing matches these filters</div>
        <div id="loadscr">
          <div class="spin"></div>
          <div class="msg" id="loadMsg">Loading the sheet…</div>
          <button class="btn hide" id="retryBtn">Try again</button>
        </div>
      </div>

      <footer>
        <span id="statLine">—</span>
        <div class="spacer"></div>
        <button class="btn sm" id="copySelBtn">⧉ Copy</button>
        <button class="btn sm" id="csvBtn">⤓ CSV</button>
        <button class="btn sm" id="xlsxBtn">⤓ Excel</button>
      </footer>
    </section>
  </div>
</div>

<!-- ============ DRAWER ============ -->
<div id="drawer">
  <div class="dhead">
    <h3 id="dTitle">—</h3>
    <button class="btn sm" id="dCopy" title="Copy the item name">⧉</button>
    <button class="btn sm ghost" id="dClose">×</button>
  </div>
  <div class="dbody" id="dBody"></div>
</div>

<div id="toasts"></div>

<script>
/* ============================================================
   CALIPOKE STATION — SUPPLIER TRACKER (read-only viewer)

   Reads the "Supplier Shipment Tracker" workbook — one tab per supplier —
   and the company inventory workbook (barcodes + type / brand / series).
   Neither sheet is ever written to.

   Every supplier tab has its own layout, so columns are found by their header
   names. For each order line the mode works out:
     item name (the "Name on Shipment Tracker / SOH name" column when it is filled,
     otherwise "Item"), order qty, cost per item, total cost, delivered,
     to be delivered and the PO# (when the tab has one).

   Change the two links below if a workbook ever moves.
   ============================================================ */
const SUPPLIER_SHEET_URL  = 'https://docs.google.com/spreadsheets/d/1RdNxH6LhMhJx7aUh43G7i4tV4zulw8tc489cSngmDKM/edit?usp=sharing';
const INVENTORY_SHEET_URL = 'https://docs.google.com/spreadsheets/d/13vYpuca93GKyRDcQJA3R6DFoP-MrAm_idEnBNgpKpTw/edit?usp=sharing';
const INVENTORY_TAB = 'Inventory';
/* tabs of the supplier workbook that are NOT a supplier: per-release summaries that repeat orders already
   listed in the suppliers' own tabs. Remove a name from this list to show that tab as a supplier. */
const NOT_SUPPLIER_TABS = ['Terastal Festival','Battle Partner','paradise'];
const BUILD     = '2026-11-27a';
const SUP_TTL   = 60*60*1000;         // supplier sheet: cached copy older than 1 h is refreshed on open
const INV_TTL   = 12*60*60*1000;      // inventory catalog: 12 h
const ROWH      = 32;

/* ---------- tiny helpers ---------- */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = v => (v==null?'':String(v)).trim().toLowerCase().replace(/\s+/g,' ');
const sn   = v => (v==null?'':String(v)).toLowerCase().replace(/[^a-z0-9]/g,'');
const filled = v => v!=null && String(v).trim()!=='';
function toast(msg,kind='info',ms=2600){
  const el=document.createElement('div'); el.className='toast '+kind; el.textContent=msg;
  $('#toasts').appendChild(el);
  setTimeout(()=>{el.style.transition='.25s'; el.style.opacity='0'; setTimeout(()=>el.remove(),260)},ms);
}
function num(v){
  if(v==null||v==='') return null;
  if(typeof v==='number') return isFinite(v)?v:null;
  if(v instanceof Date) return null;
  /* strict on purpose: "SF156100802349" or "1,034,700 Yen" are NOT quantities */
  const s=String(v).trim().replace(/[$,\s]/g,'').replace(/%$/,'');
  if(!/^-?\d*\.?\d+$/.test(s)) return null;
  const n=parseFloat(s); return isFinite(n)?n:null;
}
function isDate(v){ return v instanceof Date && !isNaN(v); }
/* text dates: 02/06/2024, 9/3/25. A date typed without a year ("3/4") is left as text — the year is unknown. */
function parseDateText(v){
  if(isDate(v)) return v;
  if(typeof v!=='string') return null;
  const m=v.trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2}|\d{4})$/);
  if(!m) return null;
  let y=+m[3]; if(y<100) y+=2000;
  const d=new Date(y,+m[1]-1,+m[2]);
  return (d.getMonth()===+m[1]-1) ? d : null;
}
function fmtDate(v){
  if(isDate(v)) return String(v.getMonth()+1).padStart(2,'0')+'/'+String(v.getDate()).padStart(2,'0')+'/'+String(v.getFullYear()).slice(2);
  return v==null?'':String(v);
}
function fmtMoney(v){ const n=num(v); if(n==null) return v==null?'':String(v);
  return (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtNum(v){ const n=num(v); if(n==null) return v==null?'':String(v);
  return n.toLocaleString('en-US',{maximumFractionDigits:2}); }
function cellText(v,type){
  if(v==null) return '';
  if(type==='date') return fmtDate(v);
  if(type==='money') return fmtMoney(v);
  if(type==='num')  return fmtNum(v);
  if(isDate(v)) return fmtDate(v);
  if(typeof v==='number') return fmtNum(v);
  return String(v);
}

/* ============================================================
   CACHE (IndexedDB — raw workbook bytes, so nothing is re-downloaded
   every time the mode is opened)
   ============================================================ */
const IDB={
  _db:null,
  open(){
    if(this._db) return Promise.resolve(this._db);
    return new Promise((res,rej)=>{
      const rq=indexedDB.open('cps_supplier_tracker',1);
      rq.onupgradeneeded=()=>{ rq.result.createObjectStore('cache'); };
      rq.onsuccess=()=>{ this._db=rq.result; res(rq.result); };
      rq.onerror=()=>rej(rq.error);
    });
  },
  async get(k){ try{ const db=await this.open(); return await new Promise((res,rej)=>{
      const r=db.transaction('cache','readonly').objectStore('cache').get(k);
      r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); }); }catch(e){ return null; } },
  async set(k,v){ try{ const db=await this.open(); return await new Promise((res,rej)=>{
      const r=db.transaction('cache','readwrite').objectStore('cache').put(v,k);
      r.onsuccess=()=>res(1); r.onerror=()=>rej(r.error); }); }catch(e){ return null; } }
};

/* ============================================================
   FETCH (GET only — the sheets are never modified)
   ============================================================ */
function exportUrl(link){
  const m=String(link).match(/\/spreadsheets\/d\/([A-Za-z0-9-_]+)/);
  return m ? 'https://docs.google.com/spreadsheets/d/'+m[1]+'/export?format=xlsx' : null;
}
function sheetBase(link){
  const m=String(link).match(/\/spreadsheets\/d\/([A-Za-z0-9-_]+)/);
  return m ? 'https://docs.google.com/spreadsheets/d/'+m[1]+'/edit' : link;
}
async function grab(url){
  const res=await fetch(url,{redirect:'follow',cache:'no-store',mode:'cors',credentials:'omit'});
  if(!res.ok) throw new Error('http '+res.status);
  const buf=new Uint8Array(await res.arrayBuffer());
  if(!(buf[0]===0x50 && buf[1]===0x4B)) throw new Error('private');   // not a zip → sharing is off
  return buf;
}
async function fetchBook(link){
  const ex=exportUrl(link); if(!ex) throw new Error('bad link');
  if(location.protocol==='file:') throw new Error('file');
  try{ return await grab(ex); }
  catch(e){
    if(e.message==='private') throw e;
    return await grab('https://api.allorigins.win/raw?url='+encodeURIComponent(ex));  // CORS fallback
  }
}

/* ============================================================
   READING A TAB
   Cells are read one by one so that dates come out as plain calendar days
   (no time-zone drift) and formula errors (#VALUE!, #N/A) come out empty.
   ============================================================ */
function sheetRows(ws){
  const ref=ws && ws['!ref']; if(!ref) return [];
  const rg=XLSX.utils.decode_range(ref), out=[];
  const maxC=Math.min(rg.e.c,80);
  for(let R=rg.s.r;R<=rg.e.r;R++){
    const row=new Array(maxC+1).fill(null); let any=false;
    for(let C=rg.s.c;C<=maxC;C++){
      const cell=ws[XLSX.utils.encode_cell({r:R,c:C})];
      if(!cell||cell.t==='z'||cell.t==='e'||cell.v==null) continue;
      let v=cell.v;
      if(cell.t==='n' && cell.z && XLSX.SSF.is_date(cell.z)){
        const p=XLSX.SSF.parse_date_code(v);
        if(p && p.y>1990) v=new Date(p.y,p.m-1,p.d);
      } else if(cell.t==='d' && isDate(v)){ v=new Date(v.getFullYear(),v.getMonth(),v.getDate()); }
      else if(typeof v==='string'){ if(v.trim()===''||/^#(VALUE|N\/A|REF|DIV\/0|NAME|NUM|NULL)[!?]?$/.test(v.trim())) continue; }
      row[C]=v; any=true;
    }
    out.push(any?row:null);
  }
  return out;
}

/* ---------- header names (normalised: lower case, single spaces) ---------- */
const H={
  item:     ['item','item name','product','product name','description'],
  soh:      ['name on shipment tracker','item name on shipment tracker','soh name','soh','name on soh','item name on soh','soh item name'],
  vendor:   ['supplier','seller','company name','vendor'],
  ordered:  ['order qty','ordered qty','order quantity','order box qty','qty','quantity'],
  setQty:   ['set qty','order case qty','case qty'],
  perSet:   ['qty per set','qty/set','box/case','qty/case','qty per case'],
  costItem: ['cost/item','cost per item','cost per item usd','cost/unit','cost per unit','cost/box','cost usd','unit cost','cost'],
  total:    ['total cost','cost with shipping','total cost w/shipping','total cost with shipping','total cost usd','total cost w/ shipping'],
  product:  ['product cost','product total cost'],
  delivered:['delivered qty','delivered','qty delivered'],
  date:     ['order date','date','date added'],
  paid:     ['paid date'],
  eta:      ['eta'],
  shipDate: ['ship date'],
  tracking: ['tracking','tracking #','tracking no','tracking number'],
  payment:  ['payment status','status'],
  notes:    ['notes','note','note(wire amount ref)']
};
const RX_TODELIVER=/^to be deliver|^to deliver$/;
const RX_PO=/^(product )?po\s*(#|no\.?|number)?$/;
const RX_SOH=/shipment tracker|^soh\b/;
const first=(h,list)=>{ for(const k of list){ const i=h.indexOf(k); if(i>=0) return i; } return -1; };
const every=(h,list)=>{ const o=[]; h.forEach((x,i)=>{ if(list.indexOf(x)>=0) o.push(i); }); return o; };

/* a row is a header when it names an Item column and at least two more known columns */
function mapHeader(row){
  if(!row) return null;
  const h=row.map(v=>typeof v==='string'?norm(v):'');
  const itemCols=every(h,H.item);
  let soh=first(h,H.soh); if(soh<0) soh=h.findIndex(x=>x && RX_SOH.test(x));
  if(!itemCols.length && soh<0) return null;
  const M={
    itemCols, soh,
    vendor:first(h,H.vendor), ordered:first(h,H.ordered), setQty:first(h,H.setQty), perSet:first(h,H.perSet),
    costItem:first(h,H.costItem), total:first(h,H.total), product:first(h,H.product),
    delivered:first(h,H.delivered), toDeliver:h.findIndex(x=>x && RX_TODELIVER.test(x)),
    date:first(h,H.date), paid:first(h,H.paid), dateCols:every(h,H.date), etaCols:every(h,H.eta), shipDate:first(h,H.shipDate),
    trackCols:every(h,H.tracking), payment:first(h,H.payment), notesCols:every(h,H.notes),
    poCols:[], headers:row.map(v=>v==null?'':String(v).trim())
  };
  h.forEach((x,i)=>{ if(x && RX_PO.test(x)) M.poCols.push(i); });
  /* two "Item" columns side by side (PANDE, Labubu, Kickz): the second one is the name we use ourselves */
  if(M.soh<0 && itemCols.length>1) M.soh=itemCols[1];
  M.item = itemCols.length ? itemCols[0] : -1;
  let known=0; ['ordered','costItem','total','delivered','toDeliver','date','paid','vendor','setQty'].forEach(k=>{ if(M[k]>=0) known++; });
  if(M.etaCols.length) known++; if(M.poCols.length) known++;
  return known>=2 ? M : null;
}

/* ---------- PO numbers ---------- */
function poFrom(v){
  if(!filled(v) || isDate(v)) return [];
  const s=String(v), out=[]; let m;
  const rx=/\bPO\s*#?\s*:?\s*(\d{2,7})\b/gi;
  while((m=rx.exec(s))) out.push('PO#'+m[1]);
  return out;
}
function rowPO(c,M){
  const out=[];
  const add=a=>a.forEach(p=>{ if(out.indexOf(p)<0) out.push(p); });
  M.poCols.forEach(i=>{
    const v=c[i]; if(!filled(v)) return;
    const a=poFrom(v);
    if(a.length) add(a);
    else if(typeof v==='number' && v>0 && v<1e7 && v===Math.round(v)) add(['PO#'+v]);
    else if(typeof v==='string' && /^#?\s*\d{2,7}$/.test(v.trim())) add(['PO#'+v.replace(/\D/g,'')]);
  });
  /* some tabs keep "PO#1218" in whatever column sits left of the item (Kevin, Keisuke, fuggler) */
  if(!out.length){ const lim=M.item>=0?M.item:(M.soh>=0?M.soh:0); for(let i=0;i<lim;i++) add(poFrom(c[i])); }
  return out;
}

/* ============================================================
   INVENTORY CATALOG — barcode + type / brand / series by item name
   ============================================================ */
const CAT={ byNorm:new Map(), bySn:new Map(), n:0, ok:false };
const clean = v => { const s=(v==null?'':String(v)).trim(); return (/^#N\/A$/i.test(s))?'':s; };
function parseCatalog(buf){
  let wb; try{ wb=XLSX.read(buf,{type:'array',sheets:INVENTORY_TAB}); }catch(e){ wb=XLSX.read(buf,{type:'array'}); }
  const name=wb.SheetNames.find(n=>norm(n)===norm(INVENTORY_TAB))||wb.SheetNames[0];
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:false,defval:''});
  CAT.byNorm=new Map(); CAT.bySn=new Map(); CAT.n=0; CAT.ok=false;
  if(rows.length<2) return;
  const h=rows[0].map(norm);
  const pc=(...k)=>{ for(const x of k){ const i=h.indexOf(x); if(i>=0) return i; } return -1; };
  const ci={ name:pc('item name','item','name'), variation:pc('variation','variant'), barcode:pc('barcode','upc','sku','ean'),
             type:pc('type','category'), brand:pc('brand'), series:pc('series') };
  if(ci.name<0) return;
  for(let r=1;r<rows.length;r++){
    const row=rows[r]; const nm=String(row[ci.name]==null?'':row[ci.name]).trim(); if(!nm) continue;
    const k=norm(nm);
    let e=CAT.byNorm.get(k);
    if(!e){ e={key:k,name:nm,barcode:'',barcodes:[],type:'',brand:'',series:''}; CAT.byNorm.set(k,e);
      const s=sn(nm); if(s && !CAT.bySn.has(s)) CAT.bySn.set(s,e); CAT.n++; }
    const va=ci.variation>=0?norm(row[ci.variation]):'';
    const bc=ci.barcode>=0?clean(row[ci.barcode]):'';
    if(bc && e.barcodes.indexOf(bc)<0) e.barcodes.push(bc);
    if(bc && (!e.barcode || va==='default')) e.barcode=bc;
    ['type','brand','series'].forEach(f=>{ const v=ci[f]>=0?clean(row[ci[f]]):''; if(v && (!e[f] || va==='default')) e[f]=v; });
  }
  CAT.ok=CAT.n>0;
}
function catFind(v){
  if(!filled(v)) return null;
  return CAT.byNorm.get(norm(v)) || CAT.bySn.get(sn(v)) || null;
}

/* ============================================================
   SUPPLIER WORKBOOK → order lines
   ============================================================ */
const DATA={ tabs:[], lines:[], skipped:[], at:0 };

function parseSuppliers(buf){
  const wb=XLSX.read(buf,{type:'array',cellNF:true,cellDates:false});
  const tabs=[], skipped=[];
  wb.SheetNames.forEach((name,order)=>{
    if(NOT_SUPPLIER_TABS.some(n=>norm(n)===norm(name))){ skipped.push(name.trim()); return; }
    const rows=sheetRows(wb.Sheets[name]);
    /* header: first row (of the top 8) that maps to an order table */
    let M=null, hIdx=-1;
    for(let r=0;r<Math.min(8,rows.length);r++){ const m=mapHeader(rows[r]); if(m){ M=m; hIdx=r; break; } }
    if(!M){ if(rows.some(r=>r)) skipped.push(name.trim()); return; }
    const tab={ name:name.trim(), order, lines:[], headers:M.headers, usesSets:false };
    const raw=[];
    for(let r=hIdx+1;r<rows.length;r++){
      const c=rows[r]; if(!c) continue;
      const again=mapHeader(c);
      if(again && again.item>=0 && filled(c[again.item]) && H.item.indexOf(norm(c[again.item]))>=0){ M=again; continue; }   // header repeated lower down
      const at=i=> (i>=0 && i<c.length) ? c[i] : null;
      const item=at(M.item), soh=at(M.soh);
      if(!filled(item) && !filled(soh)) continue;
      const O=num(at(M.ordered)), S=num(at(M.setQty));
      let D=num(at(M.delivered)), T=num(at(M.toDeliver));
      const dTxt=norm(at(M.delivered));
      if(D==null && O!=null){ if(/^(yes|y|delivered|done|received)$/.test(dTxt)){ D=O; if(T==null) T=0; } else if(/^(no|n|not yet)$/.test(dTxt)){ D=0; if(T==null) T=O; } }
      const cost=num(at(M.costItem)), tot=num(at(M.total)), prod=num(at(M.product));
      if(O==null && D==null && tot==null && prod==null && !(T!=null && T!==0)) continue;   // a label, a price note or a side note — not an order
      raw.push({ r:r+1, c, M, item, soh, O, S, D, T, cost, tot, prod });
    }
    /* Delivered / To be delivered are sometimes kept in SETS while Order Qty is in units
       (TenTOY, PANDE, Labubu, Bekalan…): delivered + to deliver = Set Qty. Those are converted
       to units so every number in a line means the same thing. */
    let nSets=0, nUnits=0;
    raw.forEach(x=>{
      x.inSets=false;
      if(x.S!=null && x.S>0 && x.O!=null && x.O>0 && Math.abs(x.S-x.O)>1e-6 && x.D!=null && x.T!=null){
        const sum=x.D+x.T;
        if(Math.abs(sum-x.O)<1e-6){ nUnits++; x.unitSure=true; }
        else if(Math.abs(sum-x.S)<1e-6){ nSets++; x.inSets=true; }
      }
    });
    tab.usesSets = nSets>0 && nSets>=nUnits;
    raw.forEach(x=>{
      if(!x.inSets && !x.unitSure && tab.usesSets && x.S!=null && x.S>0 && x.O!=null && x.O>x.S){
        const big=Math.max(x.D==null?0:x.D, x.T==null?0:x.T);
        if(big<=x.S+1e-6 && (x.D!=null||x.T!=null)) x.inSets=true;       // only one of the two filled in — same convention as the rest of the tab
      }
      tab.lines.push(makeLine(tab,x));
    });
    if(tab.lines.length) tabs.push(tab); else skipped.push(tab.name);
  });
  DATA.tabs=tabs; DATA.skipped=skipped;
  DATA.lines=tabs.reduce((a,t)=>a.concat(t.lines),[]);
}

function makeLine(tab,x){
  const c=x.c, M=x.M, at=i=> (i>=0 && i<c.length) ? c[i] : null;
  const firstOf=cols=>{ for(const i of cols){ if(filled(c[i])) return c[i]; } return null; };
  let O=x.O, D=x.D, T=x.T;
  let setNote='';
  if(x.inSets){
    const f=x.O/x.S;
    setNote=(D!=null?fmtNum(D):'—')+' delivered / '+(T!=null?fmtNum(T):'—')+' to deliver, counted in sets of '+fmtNum(f);
    if(D!=null) D=D*f; if(T!=null) T=T*f;
  }
  if(T==null && O!=null && D!=null) T=O-D;
  if(D==null && O!=null && T!=null) D=O-T;
  /* credits, refunds and discounts (negative money) are not goods: they count in Total cost only */
  const adj = (x.cost!=null && x.cost<0) || (x.tot!=null && x.tot<0) || (x.tot==null && x.prod!=null && x.prod<0);
  /* ordered, but Delivered and To be delivered were both left empty in a tab that has those columns:
     nothing has been marked as received yet, so the whole quantity is still to be delivered */
  let assumed=false;
  if(!adj && D==null && T==null && O!=null && O>0 && (M.delivered>=0 || M.toDeliver>=0)){ D=0; T=O; assumed=true; }
  if(adj){ D=null; T=null; }
  /* cost: unit cost from its column, otherwise total ÷ qty; total: the tab's total (with shipping when the tab has it),
     otherwise product cost, otherwise qty × unit cost */
  let total=x.tot, totalSrc='sheet';
  if(total==null && x.prod!=null){ total=x.prod; totalSrc='product cost'; }
  let cost=x.cost, costSrc='sheet';
  if(total==null && O!=null && cost!=null){ total=O*cost; totalSrc='qty × cost'; }
  if(cost==null && total!=null && O){ cost=total/O; costSrc='total ÷ qty'; }
  /* name: the name we use ourselves (SOH column) when it is filled, otherwise the supplier's item name;
     whichever of them is found in the inventory catalog wins */
  const itemS=filled(x.item)?String(x.item).trim():'', sohS=filled(x.soh)?String(x.soh).trim():'';
  const extra=M.itemCols.slice(1).map(i=>filled(c[i])?String(c[i]).trim():'').filter(Boolean);
  let cat=null;
  for(const cand of [sohS,itemS].concat(extra)){ if(cand && (cat=catFind(cand))) break; }
  const name = cat ? cat.name : (sohS||itemS);
  /* order date: its own column; many tabs keep it in an unlabeled first column; then Paid Date / Date Added */
  let dRaw = filled(at(M.date)) ? at(M.date) : (filled(c[0]) && (isDate(c[0])||parseDateText(c[0])) ? c[0] : at(M.paid));
  if(!filled(dRaw)) dRaw=firstOf(M.dateCols);
  const d = isDate(dRaw) ? dRaw : parseDateText(dRaw);
  const vendor = filled(at(M.vendor)) ? String(at(M.vendor)).trim() : '';
  const po=rowPO(c,M);
  let status='unknown';
  if(adj) status='adj';
  else if(T!=null && T>1e-6) status=(D!=null && D>1e-6)?'partial':'pending';
  else if((D!=null && D>1e-6) || (T!=null && O!=null)) status='delivered';
  const eta = firstOf(M.etaCols)!=null ? firstOf(M.etaCols) : at(M.shipDate);
  const L={
    tab:tab.name, tabOrder:tab.order, srow:x.r, cells:c, headers:M.headers,
    name, key: cat ? 'c|'+cat.key : 'x|'+norm(name), cat,
    item:itemS, soh:sohS, vendor, po:po.join(', '), poList:po,
    date:d||dRaw, d,
    O, D, T, cost, total, costSrc, totalSrc, setNote, status, adj, assumed,
    open: (T!=null && T>0 && cost!=null) ? T*cost : null,
    eta, payment:at(M.payment), tracking:firstOf(M.trackCols), notes:firstOf(M.notesCols),
    barcode:cat?cat.barcode:'', type:cat?cat.type:'', brand:cat?cat.brand:'', series:cat?cat.series:''
  };
  L._s=[tab.name,vendor,name,itemS,sohS,extra.join(' '),L.po,L.po.replace(/#/g,' '),(cat?cat.barcodes.join(' '):''),L.type,L.brand,L.series,
        isDate(eta)?fmtDate(eta):(eta==null?'':eta), L.tracking==null?'':L.tracking, L.notes==null?'':L.notes, fmtDate(L.date)].join(' ').toLowerCase();
  return L;
}

    C('type','Type',104,'text',r=>r.type,true),
    C('brand','Brand',110,'text',r=>r.brand,true),
    C('series','Series',130,'text',r=>r.series,true),
    C('O','Ordered',84,'num',r=>r.O),
    C('cost','Cost/item',96,'money',r=>r.cost),
    C('total','Total cost',112,'money',r=>r.total),
    C('D','Delivered',92,'num',r=>r.D),
    C('T','To deliver',92,'num',r=>r.T),
    C('status','Status',104,'status',r=>r.status),
    C('eta','ETA',130,'text',r=>r.eta),
    C('open','Open value',108,'money',r=>r.open,true),
    C('vendor','Vendor (in tab)',140,'text',r=>r.vendor,true),
    C('payment','Payment',150,'text',r=>r.payment,true),
    C('tracking','Tracking',140,'text',r=>r.tracking,true),
    C('notes','Notes',220,'text',r=>r.notes,true),
    C('srow','Row',56,'num',r=>r.srow,true)
  ],
  items:[
    C('name','Item',290,'name',r=>r.name),
    C('barcode','Barcode',128,'code',r=>r.barcode),
    C('type','Type',104,'text',r=>r.type,true),
    C('brand','Brand',110,'text',r=>r.brand,true),
    C('series','Series',130,'text',r=>r.series,true),
    C('sups','Suppliers',190,'text',r=>r.sups),
    C('n','Lines',64,'num',r=>r.n),
    C('O','Ordered',90,'num',r=>r.O),
    C('cost','Avg cost/item',112,'money',r=>r.cost),
    C('total','Total cost',118,'money',r=>r.total),
    C('D','Delivered',92,'num',r=>r.D),
    C('T','To deliver',92,'num',r=>r.T),
    C('status','Status',104,'status',r=>r.status),
    C('open','Open value',108,'money',r=>r.open),
    C('po','PO#',170,'code',r=>r.po),
    C('date','Last order',92,'date',r=>r.date)
  ]
};
const FACETS=['type','brand','series'];
const FLABEL={type:'Type',brand:'Brand',series:'Series'};
const NONE='\u0000';                               // rows the catalog has no category for

/* ---------- UI state ---------- */
const ST={
  sup:null,                   // null = all suppliers, otherwise a Set of tab names
  status:'all', q:'', from:'', to:'',
  type:new Set(), brand:new Set(), series:new Set(),    // empty = all
  mode:'lines', sort:{}, cols:{}, sel:new Set(),
  lines:[], rows:[], loading:true, supFilter:'', supSort:'sheet'
};
(function restore(){
  if(Array.isArray(pref.sup)) ST.sup=new Set(pref.sup);
  if(pref.mode==='items'||pref.mode==='lines') ST.mode=pref.mode;
  if(pref.supSort) ST.supSort=pref.supSort;
  ['lines','items'].forEach(m=>{ const a=(pref.cols||{})[m]; if(a && a.length) ST.cols[m]=new Set(a); });
})();
function savePref(){
  pref.sup = ST.sup ? [...ST.sup] : null;
  pref.mode=ST.mode; pref.supSort=ST.supSort;
  pref.cols={}; ['lines','items'].forEach(m=>{ if(ST.cols[m]) pref.cols[m]=[...ST.cols[m]]; });
  PREF.save(pref);
}

/* ============================================================
   BOOT / LOAD
   ============================================================ */
async function boot(){
  $('#buildTag').textContent='v'+BUILD;
  bindUI();
  await load(false);
}
function setLoad(msg,retry){
  $('#loadscr').classList.remove('hide');
  $('#loadMsg').innerHTML=msg;
  $('#retryBtn').classList.toggle('hide',!retry);
}
async function cached(key,url,ttl,force,label){
  if(!force){
    const c=await IDB.get(key);
    if(c && c.buf && (Date.now()-c.at)<ttl) return { buf:new Uint8Array(c.buf), at:c.at };
  }
  setLoad('Reading <b>'+label+'</b> from Google…',false);
  const buf=await fetchBook(url), at=Date.now();
  try{ await IDB.set(key,{buf:buf.buffer.slice(0),at}); }catch(e){}
  return { buf, at };
}
async function load(force){
  ST.loading=true; setLoad('Loading the sheet…',false);
  try{
    /* inventory catalog first (names → barcode / type / brand / series). If it cannot be read
       the tracker still opens — only barcodes and category filters are missing. */
    let invWarn='';
    try{
      const inv=await cached('inv',INVENTORY_SHEET_URL,INV_TTL,force,'Inventory catalog');
      setLoad('Parsing <b>Inventory catalog</b>…',false); await new Promise(r=>setTimeout(r,10));
      parseCatalog(inv.buf);
      if(!CAT.ok) invWarn='Inventory catalog is empty — barcodes and categories are not shown';
    }catch(e){
      const old=await IDB.get('inv');
      if(old && old.buf){ try{ parseCatalog(new Uint8Array(old.buf)); }catch(e2){} }
      if(!CAT.ok) invWarn='Inventory catalog could not be loaded — barcodes and categories are not shown';
    }
    const sup=await cached('sup2',SUPPLIER_SHEET_URL,SUP_TTL,force,'Supplier Shipment Tracker');
    setLoad('Parsing <b>Supplier Shipment Tracker</b>…',false); await new Promise(r=>setTimeout(r,10));
    parseSuppliers(sup.buf);
    DATA.at=sup.at;
    /* forget saved suppliers that no longer exist as tabs */
    if(ST.sup){ const have=new Set(DATA.tabs.map(t=>t.name)); ST.sup=new Set([...ST.sup].filter(n=>have.has(n))); if(!ST.sup.size) ST.sup=null; }
    ST.loading=false;
    $('#loadscr').classList.add('hide');
    $$('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.m===ST.mode));
    $('#supSort').value=ST.supSort;
    renderSuppliers(); render(); syncPill();
    if(invWarn) toast(invWarn,'warn',6000);
  }catch(err){
    ST.loading=false;
    let msg;
    if(err.message==='private') msg='No access to the sheet. Sharing must be “Anyone with the link → Viewer”.';
    else if(err.message==='file') msg='Opened as a local file (file://) — the browser blocks network access. Host it on GitHub Pages or localhost.';
    else msg='Network or CORS error: '+esc(err.message);
    setLoad(msg,true);
  }
}
function syncPill(){
  const d=new Date(DATA.at), ago=Math.round((Date.now()-DATA.at)/60000);
  $('#syncPill').innerHTML='Sheet read <b>'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+'</b>'+
    (ago>1?' · '+ago+' min ago':'');
}

/* ============================================================
   SUPPLIER LIST (multi-select)
   ============================================================ */
function renderSuppliers(){
  const ft=norm(ST.supFilter);
  let list=DATA.tabs.map(t=>{
    let open=0; t.lines.forEach(l=>{ if(l.T!=null && l.T>0) open+=l.T; });
    return { name:t.name, n:t.lines.length, open, order:t.order };
  });
  if(ST.supSort==='az') list.sort((a,b)=>a.name.localeCompare(b.name));
  else if(ST.supSort==='open') list.sort((a,b)=>b.open-a.open || a.order-b.order);
  if(ft) list=list.filter(t=>norm(t.name).includes(ft));
  $('#supList').innerHTML=
    '<div class="sup'+(!ST.sup?' on':'')+'" data-all="1"><input type="checkbox"'+(!ST.sup?' checked':'')+'><span class="n"><b>All suppliers</b></span><span class="c">'+DATA.tabs.length+'</span></div>'+
    list.map(t=>{ const on=ST.sup && ST.sup.has(t.name);
      return '<div class="sup'+(on?' on':'')+'" data-sup="'+esc(t.name)+'" title="'+esc(t.name)+' · '+t.n+' lines'+(t.open?' · '+fmtNum(t.open)+' to be delivered':'')+'">'+
        '<input type="checkbox"'+(on?' checked':'')+'><span class="n">'+esc(t.name)+'</span>'+
        (t.open>0?'<span class="o">'+fmtNum(Math.round(t.open))+'</span>':'')+
        '<span class="c">'+t.n+'</span><button class="only" data-only="'+esc(t.name)+'">only</button></div>'; }).join('')+
    (list.length?'':'<div class="empty" style="padding:18px 8px;font-size:13px">No supplier with that name</div>');
  $('#supList').querySelector('[data-all]').onclick=()=>{ ST.sup=null; afterSup(); };
  $$('#supList [data-sup]').forEach(el=>{
    el.onclick=e=>{
      const nm=el.dataset.sup;
      if(e.target.dataset.only!==undefined){ ST.sup=new Set([nm]); afterSup(); return; }
      const s=ST.sup?new Set(ST.sup):new Set();
      if(s.has(nm)) s.delete(nm); else s.add(nm);
      ST.sup = (s.size===0 || s.size===DATA.tabs.length) ? null : s;
      afterSup();
    };
    el.ondblclick=()=>{ ST.sup=new Set([el.dataset.sup]); afterSup(); };
  });
  $('#supBadge').textContent = ST.sup ? ST.sup.size+'/'+DATA.tabs.length : 'all';
  $('#supBadge').classList.toggle('off',!ST.sup);
  $('#sideNote').textContent = 'Yellow = units still to be delivered.'+(DATA.skipped.length?' Not shown (not a supplier order table): '+DATA.skipped.join(', ')+'.':'');
}
function afterSup(){ savePref(); renderSuppliers(); afterFilter(); }

/* ============================================================
   FILTERS
   ============================================================ */
function passes(r,skip){
  if(ST.sup && !ST.sup.has(r.tab)) return false;
  if(ST.status==='delivered'){ if(!(r.D!=null && r.D>1e-6)) return false; }
  else if(ST.status==='pending'){ if(!(r.T!=null && r.T>1e-6)) return false; }
  for(const f of FACETS){ if(f===skip) continue; const s=ST[f]; if(s.size && !s.has(r[f]||NONE)) return false; }
  if(ST._from||ST._to){ if(!r.d) return false; if(ST._from && r.d<ST._from) return false; if(ST._to && r.d>ST._to) return false; }
  if(ST._terms.length){ const s=r._s; for(const t of ST._terms){ if(!s.includes(t)) return false; } }
  return true;
}
function prepFilter(){
  ST._terms=ST.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  ST._from=ST.from?new Date(ST.from+'T00:00:00'):null;
  ST._to=ST.to?new Date(ST.to+'T23:59:59'):null;
}
function groupItems(lines){
  const m=new Map();
  lines.forEach(l=>{
    let g=m.get(l.key);
    if(!g){ g={ group:true, key:l.key, name:l.name, cat:l.cat, barcode:l.barcode, type:l.type, brand:l.brand, series:l.series,
                lines:[], supSet:new Set(), poSet:new Set(), n:0, O:null, D:null, T:null, total:null, open:null, d:null, date:null, _cq:0, _cv:0 };
      m.set(l.key,g); }
    g.lines.push(l); g.n++; g.supSet.add(l.tab); l.poList.forEach(p=>g.poSet.add(p));
    ['O','D','T','total','open'].forEach(k=>{ if(l[k]!=null && !(l.adj && k==='O')) g[k]=(g[k]||0)+l[k]; });
    if(l.O && l.cost!=null && !l.adj){ g._cq+=l.O; g._cv+=l.O*l.cost; }
    if(l.d && (!g.d || l.d>g.d)){ g.d=l.d; g.date=l.d; }
  });
  const out=[...m.values()];
  out.forEach(g=>{
    g.sups=[...g.supSet].join(', '); g.po=[...g.poSet].join(', ');
    g.cost = g._cq>0 ? g._cv/g._cq : null;
    g.status = (g.T!=null && g.T>1e-6) ? ((g.D!=null && g.D>1e-6)?'partial':'pending') : ((g.D!=null && g.D>1e-6)||g.T!=null ? 'delivered' : (g.lines.every(l=>l.adj)?'adj':'unknown'));
  });
  return out;
}
function visibleCols(){
  const all=COLS[ST.mode], saved=ST.cols[ST.mode];
  return all.filter(c=>saved?saved.has(c.k):!c.off);
}
function applyFilters(){
  prepFilter();
  ST.lines=DATA.lines.filter(r=>passes(r,null));
  let rows = ST.mode==='items' ? groupItems(ST.lines) : ST.lines;
  const so=ST.sort[ST.mode];
  if(so){
    const col=COLS[ST.mode].find(c=>c.k===so.k);
    if(col){
      const dir=so.dir;
      rows=rows.slice().sort((a,b)=>{
        const av=col.get(a), bv=col.get(b);
        const an=(col.type==='date')?(isDate(av)?av.getTime():null):num(av);
        const bn=(col.type==='date')?(isDate(bv)?bv.getTime():null):num(bv);
        /* empty cells always go to the bottom, whichever way the column is sorted */
        const ae=!filled(av), be=!filled(bv);
        if(ae||be) return ae&&be ? 0 : (ae?1:-1);
        let c;
        if(an!=null&&bn!=null) c=an-bn;
        else if(an!=null) c=-1; else if(bn!=null) c=1;
        else c=String(av).localeCompare(String(bv),'en',{numeric:true,sensitivity:'base'});
        return dir==='asc'?c:-c;
      });
    }
  } else if(ST.mode==='items'){
    rows=rows.slice().sort((a,b)=>a.name.localeCompare(b.name,'en',{numeric:true,sensitivity:'base'}));
  }
  ST.rows=rows;
}
function afterFilter(){ ST.sel.clear(); lastClick=-1; applyFilters(); paint(); updFacetBadges(); }

/* ---------- type / brand / series dropdowns ---------- */
function facetOptions(f){
  prepFilter();
  const cnt=new Map();
  DATA.lines.forEach(r=>{ if(passes(r,f)){ const v=r[f]||NONE; cnt.set(v,(cnt.get(v)||0)+1); } });
  ST[f].forEach(v=>{ if(!cnt.has(v)) cnt.set(v,0); });
  return [...cnt.entries()].map(([v,n])=>({v,n})).sort((a,b)=> (a.v===NONE)-(b.v===NONE) || a.v.localeCompare(b.v,'en',{sensitivity:'base'}));
}
function renderFacet(f,filterText){
  const host=$('#'+f+'Drop'), opts=facetOptions(f), ft=norm(filterText||'');
  const list=opts.filter(o=>!ft||norm(o.v===NONE?'not in the catalog':o.v).includes(ft));
  host.innerHTML='<h4>'+FLABEL[f]+'</h4>'+
    (opts.length>8?'<input class="dsearch" placeholder="filter…" autocomplete="off" value="'+esc(filterText||'')+'">':'')+
    '<div class="droprow"><button class="btn sm" data-clear="1">All</button></div>'+
    list.map(o=>'<label class="chk'+(o.n?'':' zero')+'"><input type="checkbox" data-v="'+esc(o.v)+'"'+(ST[f].has(o.v)?' checked':'')+'>'+
      '<span class="n">'+(o.v===NONE?'<i>Not in the catalog</i>':esc(o.v))+'</span><span class="c">'+o.n+'</span></label>').join('')+
    (CAT.ok?'':'<div style="font-size:12.5px;color:var(--warn);margin-top:6px">Inventory catalog not loaded — no categories.</div>');
  const si=host.querySelector('.dsearch');
  if(si) si.oninput=()=>{ const v=si.value; renderFacet(f,v); const el=host.querySelector('.dsearch'); el.focus(); el.setSelectionRange(v.length,v.length); };
  host.querySelector('[data-clear]').onclick=()=>{ ST[f].clear(); renderFacet(f,filterText); afterFilter(); };
  host.querySelectorAll('[data-v]').forEach(cb=>{ cb.onchange=()=>{ if(cb.checked) ST[f].add(cb.dataset.v); else ST[f].delete(cb.dataset.v); afterFilter(); }; });
}
function updFacetBadges(){
  FACETS.forEach(f=>{ const b=$('#'+f+'Badge'); b.textContent=ST[f].size?ST[f].size:'all'; b.classList.toggle('off',!ST[f].size); });
}

/* ---------- columns ---------- */
function renderColDrop(){
  const all=COLS[ST.mode], host=$('#colsDrop');
  const vis=new Set(visibleCols().map(c=>c.k));
  host.innerHTML='<h4>Visible columns</h4>'+
    '<div class="droprow"><button class="btn sm" data-all="1">All</button><button class="btn sm" data-def="1">Default</button></div>'+
    all.map(c=>'<label class="chk"><input type="checkbox" data-col="'+c.k+'"'+(vis.has(c.k)?' checked':'')+'><span class="n">'+esc(c.t)+'</span></label>').join('');
  host.querySelector('[data-all]').onclick=()=>{ ST.cols[ST.mode]=new Set(all.map(c=>c.k)); savePref(); renderColDrop(); paint(); };
  host.querySelector('[data-def]').onclick=()=>{ delete ST.cols[ST.mode]; savePref(); renderColDrop(); paint(); };
  host.querySelectorAll('[data-col]').forEach(cb=>{
    cb.onchange=()=>{
      const cur=new Set(visibleCols().map(c=>c.k));
      if(cb.checked) cur.add(cb.dataset.col); else cur.delete(cb.dataset.col);
      if(cur.size===0){ cb.checked=true; toast('At least one column has to stay visible','warn'); return; }
      ST.cols[ST.mode]=cur; savePref(); paint(); renderColDrop();
    };
  });
  $('#colsBadge').textContent=vis.size+'/'+all.length;
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){ renderColDrop(); applyFilters(); paint(); updFacetBadges(); }
const STATUS={ delivered:['ok','Delivered'], pending:['warn','To deliver'], partial:['part','Partial'], adj:['','Credit'], unknown:['','No data'] };
function paint(){
  const cols=visibleCols();
  const total = cols.reduce((a,c)=>a+c.w,0) + 34;
  $('#tinner').style.width=total+'px';
  const so=ST.sort[ST.mode]||{};
  $('#thead').innerHTML =
    '<div class="th" style="width:34px;flex-basis:34px;text-align:center" data-selall="1" title="Select all">☑</div>'+
    cols.map(c=>'<div class="th'+((c.type==='num'||c.type==='money')?' num':'')+'" data-col="'+c.k+'" style="flex-basis:'+c.w+'px;width:'+c.w+'px">'+
      esc(c.t)+(so.k===c.k?' <span class="ar">'+(so.dir==='asc'?'▲':'▼')+'</span>':'')+'</div>').join('');
  $('#thead').querySelectorAll('[data-col]').forEach(th=>{
    th.onclick=()=>{
      const k=th.dataset.col, cur=ST.sort[ST.mode];
      ST.sort[ST.mode] = (cur&&cur.k===k) ? (cur.dir==='asc'?{k,dir:'desc'}:null) : {k,dir:'asc'};
      applyFilters(); paint();
    };
  });
  $('#thead').querySelector('[data-selall]').onclick=()=>{ if(ST.sel.size===ST.rows.length){ ST.sel.clear(); } else { ST.rows.forEach(r=>ST.sel.add(r)); } drawRows(); stats(); };
  $('#spacer').style.height=(ST.rows.length*ROWH)+'px';
  $('#emptyMsg').classList.toggle('hide', ST.rows.length>0 || ST.loading);
  drawRows(); stats();
}
function drawRows(){
  const sc=$('#tscroll'), cols=visibleCols();
  const top=sc.scrollTop, h=sc.clientHeight;
  const firstI=Math.max(0,Math.floor(top/ROWH)-8);
  const lastI=Math.min(ST.rows.length,Math.ceil((top+h)/ROWH)+8);
  let html='';
  for(let i=firstI;i<lastI;i++){
    const r=ST.rows[i];
    html+='<div class="trow'+(ST.sel.has(r)?' sel':'')+(i%2?' alt':'')+'" data-i="'+i+'" style="top:'+(i*ROWH)+'px">'+
      '<div class="td" style="flex-basis:34px;width:34px;justify-content:center"><input class="cb" type="checkbox" data-cb="'+i+'"'+(ST.sel.has(r)?' checked':'')+'></div>'+
      cols.map(c=>{
        const v=c.get(r), st='style="flex-basis:'+c.w+'px;width:'+c.w+'px"';
        if(c.type==='status'){ const s=STATUS[v]||STATUS.unknown; return '<div class="td" '+st+'><span class="badge '+s[0]+'">'+s[1]+'</span></div>'; }
        if(c.type==='name'){
          return '<div class="td" '+st+' title="'+esc(v)+(r.item && norm(r.item)!==norm(v)?' — in the sheet: '+esc(r.item):'')+(r.cat?'':' — not in the inventory catalog')+'">'+
            esc(v)+(r.cat||!CAT.ok?'':'<span class="nocat" title="Not found in the inventory catalog">◌</span>')+'</div>';
        }
        let cls='td', title='';
        if(c.type==='num'||c.type==='money') cls+=' '+c.type;
        else if(c.type==='date') cls+=' date';
        else if(c.type==='code') cls+=' code';
        if(c.k==='T'){ const n=num(v); if(n!=null&&n>1e-6) cls+=' pos'; else if(n!=null) cls+=' zero'; }
        if(c.k==='D'){ const n=num(v); if(n!=null&&n>1e-6) cls+=' good'; else if(n!=null) cls+=' zero'; }
        if(c.k==='open'){ const n=num(v); if(n!=null&&n>0) cls+=' pos'; }
        if(c.k==='notes'||c.k==='srow'||c.k==='item'||c.k==='payment') cls+=' dim';
        const txt=cellText(v,c.type==='code'||c.type==='text'?null:c.type);
        title=txt;
        if((c.k==='D'||c.k==='T') && r.setNote) title=txt+' units — in the sheet: '+r.setNote;
        if((c.k==='D'||c.k==='T') && r.assumed) title=txt+' — Delivered / To be delivered are empty in the sheet, so nothing counts as received yet';
        if(c.k==='cost' && r.costSrc && r.costSrc!=='sheet') title=txt+' ('+r.costSrc+')';
        if(c.k==='total' && r.totalSrc && r.totalSrc!=='sheet') title=txt+' ('+r.totalSrc+')';
        return '<div class="'+cls+'" '+st+' title="'+esc(title)+'">'+esc(txt)+'</div>';
      }).join('')+'</div>';
  }
  $('#rowsHost').innerHTML=html;
  $('#rowsHost').querySelectorAll('[data-cb]').forEach(cb=>{
    cb.onclick=e=>{ e.stopPropagation();
      const i=+cb.dataset.cb, r=ST.rows[i];
      if(e.shiftKey && lastClick>=0){ const a=Math.min(lastClick,i),b=Math.max(lastClick,i);
        for(let j=a;j<=b;j++) ST.sel.add(ST.rows[j]); }
      else { if(cb.checked) ST.sel.add(r); else ST.sel.delete(r); }
      lastClick=i; drawRows(); stats(); };
  });
  $('#rowsHost').querySelectorAll('.trow').forEach(tr=>{
    tr.onclick=e=>{ if(e.target.dataset.cb!==undefined) return; openDrawer(ST.rows[+tr.dataset.i]); };
  });
}
let lastClick=-1;
$('#tscroll').addEventListener('scroll',()=>{ if(!ST.loading) drawRows(); },{passive:true});
window.addEventListener('resize',()=>{ if(!ST.loading) drawRows(); });

/* totals always come from the order lines that pass the filters (or from the ticked rows) */
function stats(){
  let src=ST.lines;
  if(ST.sel.size){ src=[]; ST.sel.forEach(r=>{ if(r.group) r.lines.forEach(l=>src.push(l)); else src.push(r); }); }
  let O=0,D=0,T=0,tot=0,open=0,delVal=0; const items=new Set(), sups=new Set();
  src.forEach(r=>{
    if(r.O!=null && !r.adj) O+=r.O; if(r.D!=null) D+=r.D; if(r.T!=null && r.T>0) T+=r.T;
    if(r.total!=null) tot+=r.total; if(r.open!=null) open+=r.open;
    if(r.D!=null && r.D>0 && r.cost!=null) delVal+=r.D*r.cost;
    items.add(r.key); sups.add(r.tab);
  });
  const k=(l,v,cls)=>'<div class="kpi'+(cls?' '+cls:'')+'"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>';
  $('#kpis').innerHTML=
    k(ST.sel.size?'Selected lines':'Order lines',src.length.toLocaleString('en-US'))+
    k('Items',items.size.toLocaleString('en-US'))+
    k('Ordered',fmtNum(O))+
    k('Total cost',fmtMoney(tot))+
    k('Delivered',fmtNum(D),'good')+
    k('To be delivered',fmtNum(T),T>0?'warn':'')+
    k('Open value',fmtMoney(open),open>0?'warn':'');
  let s='<b>'+ST.rows.length.toLocaleString('en-US')+'</b> '+(ST.mode==='items'?'items':'lines');
  if(ST.mode==='lines' && DATA.lines.length!==ST.rows.length) s+=' of '+DATA.lines.length.toLocaleString('en-US');
  s+=' · <b>'+sups.size+'</b> supplier'+(sups.size===1?'':'s');
  s+=' · delivered value <b>'+fmtMoney(delVal)+'</b>';
  if(ST._from||ST._to) s+=' · lines without a full date are hidden by the period filter';
  if(ST.sel.size) s+=' · selected <b>'+ST.sel.size+'</b>';
  $('#statLine').innerHTML=s;
}

/* ============================================================
   UI BINDINGS
   ============================================================ */
function bindUI(){
  let t=null;
  $('#q').oninput=()=>{ $('#qClr').classList.toggle('hide',!$('#q').value);
    clearTimeout(t); t=setTimeout(()=>{ ST.q=$('#q').value; afterFilter(); },140); };
  $('#qClr').onclick=()=>{ $('#q').value=''; ST.q=''; $('#qClr').classList.add('hide'); afterFilter(); $('#q').focus(); };
  $('#dFrom').onchange=()=>{ ST.from=$('#dFrom').value; afterFilter(); };
  $('#dTo').onchange=()=>{ ST.to=$('#dTo').value; afterFilter(); };
  $$('#statusSeg button').forEach(b=>b.onclick=()=>{
    ST.status=b.dataset.s; $$('#statusSeg button').forEach(x=>x.classList.toggle('on',x===b)); afterFilter(); $('#tscroll').scrollTop=0; });
  $$('#modeSeg button').forEach(b=>b.onclick=()=>{
    ST.mode=b.dataset.m; $$('#modeSeg button').forEach(x=>x.classList.toggle('on',x===b)); savePref();
    ST.sel.clear(); lastClick=-1; render(); $('#tscroll').scrollTop=0; });
  let ts=null;
  $('#supSearch').oninput=()=>{ clearTimeout(ts); ts=setTimeout(()=>{ ST.supFilter=$('#supSearch').value; renderSuppliers(); },100); };
  $('#supAll').onclick=()=>{ ST.sup=null; afterSup(); };
  $('#supSort').onchange=()=>{ ST.supSort=$('#supSort').value; savePref(); renderSuppliers(); };
  $('#sideBtn').onclick=e=>{ e.stopPropagation(); $('#side').classList.toggle('on'); };
  $('#content').addEventListener('click',()=>$('#side').classList.remove('on'));
  $('#clearBtn').onclick=()=>{
    ST.q=''; $('#q').value=''; $('#qClr').classList.add('hide');
    ST.from=''; ST.to=''; $('#dFrom').value=''; $('#dTo').value='';
    ST.status='all'; $$('#statusSeg button').forEach(x=>x.classList.toggle('on',x.dataset.s==='all'));
    FACETS.forEach(f=>ST[f].clear());
    ST.sup=null; ST.sort={}; ST.supFilter=''; $('#supSearch').value='';
    savePref(); renderSuppliers(); afterFilter();
  };
  // dropdown open/close
  const pairs=[['#typeBtn','#typeDrop','type'],['#brandBtn','#brandDrop','brand'],['#seriesBtn','#seriesDrop','series'],
               ['#colsBtn','#colsDrop',null],['#presetBtn','#presetDrop',null]];
  pairs.forEach(([b,d,f])=>{ $(b).onclick=e=>{ e.stopPropagation();
    pairs.forEach(([b2,d2])=>{ if(d2!==d) $(d2).classList.add('hide'); });
    const opening=$(d).classList.contains('hide');
    if(opening && f) renderFacet(f,'');
    if(opening && d==='#colsDrop') renderColDrop();
    $(d).classList.toggle('hide'); };
    /* clicks inside a panel must not reach the close-on-outside-click handler,
       even when the handler rebuilds the panel's contents */
    $(d).addEventListener('click',e=>e.stopPropagation()); });
  document.addEventListener('click',e=>{
    pairs.forEach(([b,d])=>{ if(!$(d).contains(e.target) && !$(b).contains(e.target)) $(d).classList.add('hide'); });
  });
  $('#presetDrop').innerHTML='<h4>Order date</h4>'+
    [['30','Last 30 days'],['90','Last 90 days'],['ytd','Year to date'],['y1','Last 12 months'],['all','All time']]
    .map(([k,l])=>'<label class="chk" data-p="'+k+'"><span class="n">'+l+'</span></label>').join('');
  $('#presetDrop').querySelectorAll('[data-p]').forEach(el=>{
    el.onclick=()=>{
      const now=new Date(); let from=null; const p=el.dataset.p;
      if(p==='30') from=new Date(Date.now()-30*864e5);
      else if(p==='90') from=new Date(Date.now()-90*864e5);
      else if(p==='ytd') from=new Date(now.getFullYear(),0,1);
      else if(p==='y1') from=new Date(now.getFullYear()-1,now.getMonth(),now.getDate());
      ST.from = from ? from.getFullYear()+'-'+String(from.getMonth()+1).padStart(2,'0')+'-'+String(from.getDate()).padStart(2,'0') : '';
      ST.to='';
      $('#dFrom').value=ST.from; $('#dTo').value='';
      $('#presetDrop').classList.add('hide');
      afterFilter();
    };
  });
  $('#refreshBtn').onclick=()=>load(true);
  $('#retryBtn').onclick=()=>load(true);
  $('#backBtn').onclick=()=>{ if(window.opener) window.close(); else location.href='index.html'; };
  $('#copySelBtn').onclick=copyRows;
  $('#csvBtn').onclick=()=>exportRows('csv');
  $('#xlsxBtn').onclick=()=>exportRows('xlsx');
  $('#dClose').onclick=closeDrawer;
  $('#dCopy').onclick=()=>{ if(drawerRow) copyText(drawerRow.name); };
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ closeDrawer(); $$('.drop').forEach(d=>d.classList.add('hide')); $('#side').classList.remove('on'); }
    if(e.key==='/' && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)){ e.preventDefault(); $('#q').focus(); }
  });
}

/* ============================================================
   COPY / EXPORT
   ============================================================ */
function expVal(c,r){ const v=c.get(r);
  if(c.type==='status') return (STATUS[v]||STATUS.unknown)[1];
  if(isDate(v)) return fmtDate(v);
  if(typeof v==='number') return Math.round(v*10000)/10000;
  return v==null?'':String(v); }
function copyText(txt){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(()=>toast('Copied','ok'),()=>fallbackCopy(txt));
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Copied','ok'); }catch(e){ toast('Could not copy','err'); }
  ta.remove();
}
function rowsForExport(){ return ST.sel.size ? ST.rows.filter(r=>ST.sel.has(r)) : ST.rows; }
function copyRows(){
  const cols=visibleCols(), rows=rowsForExport();
  if(!rows.length){ toast('No rows','warn'); return; }
  copyText([cols.map(c=>c.t).join('\t')].concat(rows.map(r=>cols.map(c=>String(expVal(c,r)).replace(/[\t\n]+/g,' ')).join('\t'))).join('\n'));
}
function exportRows(kind){
  const cols=visibleCols(), rows=rowsForExport();
  if(!rows.length){ toast('No rows','warn'); return; }
  const aoa=[cols.map(c=>c.t)].concat(rows.map(r=>cols.map(c=>expVal(c,r))));
  const stamp=new Date().toISOString().slice(0,10);
  const base='supplier-tracker_'+(ST.mode==='items'?'by-item':'lines')+(ST.status!=='all'?'_'+(ST.status==='pending'?'to-be-delivered':'delivered'):'')+'_'+stamp;
  if(kind==='csv'){
    const csv=aoa.map(r=>r.map(v=>{
      const s=v==null?'':String(v);
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(',')).join('\n');
    const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=base+'.csv'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }else{
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    /* barcodes stay text so Excel does not turn them into 4.52E+12 */
    const bi=cols.findIndex(c=>c.k==='barcode');
    if(bi>=0) for(let r=1;r<aoa.length;r++){ const ref=XLSX.utils.encode_cell({r,c:bi}); if(ws[ref]){ ws[ref].t='s'; ws[ref].v=String(aoa[r][bi]); } }
    ws['!cols']=cols.map(c=>({wch:Math.max(10,Math.min(42,Math.round(c.w/7)))}));
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'export');
    XLSX.writeFile(wb,base+'.xlsx');
  }
  toast('Exported '+rows.length+' rows','ok');
}

/* ============================================================
   ROW DRAWER
   ============================================================ */
let drawerRow=null;
function lineCard(l){
  return '<div class="mrow"><div class="t"><b>'+esc(l.tab)+(l.po?' · '+esc(l.po):'')+'</b><span class="mono">'+fmtNum(l.O)+' pcs</span></div>'+
    '<div class="s">row '+l.srow+(filled(l.date)?' · '+esc(fmtDate(l.date)):'')+' · '+fmtMoney(l.cost)+' each · '+fmtMoney(l.total)+
    ' · delivered '+(l.D==null?'—':fmtNum(l.D))+' · to deliver '+(l.T==null?'—':fmtNum(l.T))+
    (l.item && norm(l.item)!==norm(l.name)?' · in the sheet: '+esc(l.item):'')+'</div></div>';
}
function openDrawer(r){
  drawerRow=r;
  $('#dTitle').textContent=r.name||'(no name)';
  const kv=(k,v)=>'<div class="k">'+k+'</div><div class="v">'+v+'</div>';
  const s=STATUS[r.status]||STATUS.unknown;
  let html='<div class="kv">'+
    kv('Item',esc(r.name)+(r.cat?'':(CAT.ok?' <span class="badge">not in the catalog</span>':'')))+
    (r.barcode?kv('Barcode','<span class="mono">'+esc(r.cat&&r.cat.barcodes.length>1?r.cat.barcodes.join(', '):r.barcode)+'</span>'):'')+
    (r.type||r.brand||r.series?kv('Type · Brand · Series',esc([r.type,r.brand,r.series].filter(Boolean).join(' · '))):'')+
    kv('Status','<span class="badge '+s[0]+'">'+s[1]+'</span>')+
    kv('Ordered',r.O==null?'—':fmtNum(r.O))+
    kv(r.group?'Avg cost per item':'Cost per item',(r.cost==null?'—':fmtMoney(r.cost))+(r.costSrc && r.costSrc!=='sheet'?' <span class="badge">'+r.costSrc+'</span>':''))+
    kv('Total cost',(r.total==null?'—':fmtMoney(r.total))+(r.totalSrc && r.totalSrc!=='sheet'?' <span class="badge">'+r.totalSrc+'</span>':''))+
    kv('Delivered',r.D==null?'—':fmtNum(r.D))+
    kv('To be delivered',r.T==null?'—':fmtNum(r.T))+
    (r.open?kv('Open value',fmtMoney(r.open)):'')+
    (r.setNote?kv('In the sheet',esc(r.setNote)):'')+
    (r.assumed?kv('Note','Delivered and To be delivered are empty in the sheet — the whole quantity is counted as still to be delivered'):'');
  if(r.group){
    html+=kv('Suppliers',esc(r.sups))+(r.po?kv('PO#',esc(r.po)):'')+'</div>';
    html+='<div class="dsec">Order lines ('+r.lines.length+')</div>';
    r.lines.slice(0,150).forEach(l=>{ html+=lineCard(l); });
    if(r.lines.length>150) html+='<div style="color:var(--faint);font-size:12.5px">…and '+(r.lines.length-150)+' more — switch to “Order lines” to see them all.</div>';
  }else{
    html+=kv('Supplier (tab)',esc(r.tab)+' · row '+r.srow)+
      (r.vendor?kv('Vendor in the tab',esc(r.vendor)):'')+
      kv('PO#',r.po?esc(r.po):'—')+
      (filled(r.date)?kv('Date',esc(fmtDate(r.date))):'')+
      (filled(r.eta)?kv('ETA',esc(cellText(r.eta,null))):'')+
      (r.item?kv('Item (sheet)',esc(r.item)):'')+
      (r.soh?kv('SOH name (sheet)',esc(r.soh)):'')+'</div>';
    html+='<div class="dsec">Full row as in the sheet</div><div class="kv">';
    r.cells.forEach((v,i)=>{ if(!filled(v)) return;
      html+='<div class="k">'+esc(r.headers[i]||('['+XLSX.utils.encode_col(i)+']'))+'</div><div class="v">'+esc(cellText(v,null))+'</div>'; });
    html+='</div>';
  }
  html+='<div style="margin-top:14px"><a class="btn sm" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="'+sheetBase(SUPPLIER_SHEET_URL)+'">Open the Google Sheet ↗</a></div>';
  $('#dBody').innerHTML=html;
  $('#drawer').classList.add('on');
}
function closeDrawer(){ $('#drawer').classList.remove('on'); drawerRow=null; }
</script>
